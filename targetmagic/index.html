<body>
<style>
/* Layout: one indoor range lane fills the screen; scoreboard above it, the booth's control panel below. Single committed dark look. */
:root{
  color-scheme:dark;
  --booth:#151c1a;      /* booth walls, page ground */
  --panel:#1f2926;      /* control panel surface */
  --line:#34423d;       /* panel edges */
  --paper:#ebe5d3;      /* target paper, main text */
  --dim:#9aa69f;        /* secondary text */
  --brass:#cfa650;      /* selected state, casings */
  --hot:#ee6a2e;        /* hits, alerts */
  --ink:#0d1110;        /* text on brass */
  --display:"Saira Stencil One","Impact","Arial Black",sans-serif;
  --ui:"Saira Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--booth);color:var(--paper);font-family:var(--ui);font-size:17px;line-height:1.3}
.app{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 28px}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.04em;line-height:1;color:var(--paper)}
h1 .wiz{width:52px;height:52px;vertical-align:middle;margin:-12px 8px -8px 0}
h1 span{color:var(--brass)}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin:0}
.stats div{display:flex;flex-direction:column}
.stats dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stats dd{margin:0;font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:2.4em}
.stats .score dd{color:var(--brass)}

.range{position:relative;flex:1 1 auto;min-height:360px;border:1px solid var(--line);background:#0c100f;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:none;touch-action:none}
.ammo{position:absolute;left:calc(5% + 12px);bottom:9px;display:flex;gap:4px;align-items:flex-end;pointer-events:none}
.ammo i{width:7px;height:22px;border-radius:3px 3px 1px 1px;background:var(--brass);box-shadow:inset 0 -6px 0 rgba(0,0,0,.28)}
.ammo i.spent{background:transparent;outline:1px solid var(--line);outline-offset:-1px;box-shadow:none}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:calc(100% - 24px);box-sizing:border-box;padding:5px 12px;background:rgba(13,17,16,.82);border:1px solid var(--line);font-size:16px;letter-spacing:.03em;text-align:center;pointer-events:none}
.hint.alert{border-color:var(--hot);color:var(--hot)}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,17,16,.78);padding:16px}
.over .card{background:var(--panel);border:1px solid var(--brass);padding:22px 28px;text-align:center;max-width:340px;width:100%;box-sizing:border-box}
.over h2{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.05em;text-wrap:balance}
.over .big{font-size:64px;font-weight:700;line-height:1;color:var(--brass);font-variant-numeric:tabular-nums}
.over p{margin:6px 0 16px;color:var(--dim)}
.over .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);padding:12px 14px}
.group{display:flex;flex-direction:column;gap:5px;min-width:0}
.group > span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
button{font:600 16px/1 var(--ui);letter-spacing:.03em;color:var(--paper);background:var(--booth);border:1px solid var(--line);border-radius:3px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--dim)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--ink)}
button.go{background:var(--hot);border-color:var(--hot);color:var(--ink)}
button.go:hover{filter:brightness(1.08)}
.note{flex-basis:100%;margin:0;font-size:14px;color:var(--dim)}
.note a{color:var(--brass)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){h1{font-size:25px}.stats dd{font-size:22px}.stats{gap:6px 18px}}
</style>

        <button type="button" id="tImg" data-set="target" data-val="img">Your picture</button>
        <button type="button" id="tChange" hidden>Change picture</button>
      </div>
    </div>
    <div class="group"><span>Movement</span>
      <div class="seg">
        <button type="button" id="mStill" data-set="mode" data-val="still">Still</button>
        <button type="button" id="mMove" data-set="mode" data-val="move">Moving</button>
        <button type="button" id="mPop" data-set="mode" data-val="pop">Pop-up</button>
      </div>
    </div>
    <div class="group"><span>Distance</span>
      <div class="seg">
        <button type="button" id="d0" data-set="dist" data-val="0">15 yd</button>
        <button type="button" id="d1" data-set="dist" data-val="1">25 yd</button>
        <button type="button" id="d2" data-set="dist" data-val="2">50 yd</button>
        <button type="button" id="d3" data-set="dist" data-val="3">75 yd</button>
      </div>
    </div>
    <div class="group"><span>Options</span>
      <div class="seg">
        <button type="button" id="bSway" aria-pressed="true">Hand sway</button>
        <button type="button" id="bSound" aria-pressed="true">Sound</button>
      </div>
    </div>
    <div class="group"><span>Range</span>
      <div class="seg">
        <button type="button" id="bReload">Reload (R)</button>
        <button type="button" id="bClear">Fresh target</button>
        <button type="button" id="bRound" class="go">Start 30-second round</button>
      </div>
    </div>
    <p class="note">A picture you choose stays on this computer. It is never uploaded. TargetMagic is free from <a href="https://tagmagicstudio.com/">TagMagic Studio</a>.</p>
    <input class="sr" type="file" id="file" accept="image/*" tabindex="-1" aria-label="Choose a picture to use as the target">
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),ctx=cv.getContext('2d'),rangeEl=$('range');
var W=800,H=500,DPR=1;
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var PAPER='#ebe5d3',BRASS='#cfa650',HOT='#ee6a2e',INKC='#0d1110';
var MAG=10,ROUND=30,TAU=Math.PI*2;
var DIST=[15,25,50,75];                 /* yards */
var M={x:400,y:200};
var S={target:'bull',mode:'still',dist:0,z:15,sway:true,sound:true,img:null,
  score:0,shots:0,hits:0,ammo:MAG,reload:0,kick:0,flash:0,
  holes:[],pops:[],fx:[],brass:0,mz:null,
  round:false,left:ROUND,over:false,
  pop:{x:0,y:0,t:1.9,up:true,vis:1},t:0};
var best=0;
try{best=+(localStorage.getItem('targetmagic.best')||0)||0}catch(e){}

function clamp(v,a,b){return v<a?a:(v>b?b:v)}

function resize(){
  var r=rangeEl.getBoundingClientRect();
  W=Math.max(200,r.width);H=Math.max(200,r.height);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  M.x=Math.min(M.x,W);M.y=Math.min(M.y,H);
}
if(window.ResizeObserver){new ResizeObserver(resize).observe(rangeEl)}else{window.addEventListener('resize',resize)}
resize();M.x=W/2;M.y=H*0.40;

/* ---------- perspective: everything shrinks as 1/distance toward the vanishing point ---------- */
var V={x:0,y:0},K=1;                    /* K/z = one target radius, in pixels, at z yards */
var HWc=6.5,FDc=3.1,CRc=2.5,ZN=4,ZB=88; /* room half-width, floor drop, ceiling rise (in target radii); near and back-wall depth */
var SEAMS=[8,10,12.5,15,20,25,32,40,50,62,75];
var BAFF=[84,68,54,43,34,27,21,16,12,9];
var LANES=[-5.2,-2.6,0,2.6,5.2];
function frameGeom(){V.x=W/2;V.y=H*0.40;K=Math.min(W*0.40,H*0.27)*0.5*15}
function PX(c,z){return V.x+c*K/z}
function PY(c,z){return V.y+c*K/z}
function geom(){
  var u=K/S.z,r=u,x=V.x,y=V.y,vis=1,span=Math.max(0,Math.min(4*u,W*0.5-r-W*0.08));
  if(S.mode==='move'){x+=Math.sin(S.t*1.1)*span}
  else if(S.mode==='pop'){x+=S.pop.x*span;y+=S.pop.y*u;vis=S.pop.vis}
  var hw=r*1.1,hh=r*1.1,isImg=!!(S.target==='img'&&S.img);
  if(isImg){var a=S.img.naturalWidth/S.img.naturalHeight;hw=r;hh=r;if(a>=1){hh=r/a}else{hw=r*a}}
  return {x:x,y:y,r:r,u:u,hw:hw,hh:hh,vis:vis,isImg:isImg};
}
function aimPoint(){
  var x=M.x,y=M.y;
  if(S.sway){var w=clamp(Math.min(W,H)/500,0.6,1.3);
    x+=(Math.sin(S.t*1.3)*4+Math.sin(S.t*2.9)*2)*w;y+=(Math.cos(S.t*1.7)*3.5+Math.sin(S.t*3.7)*1.5)*w}
  y-=S.kick*(reduce?4:16);
  return {x:x,y:y};
}

/* ---------- sound ---------- */
var AC=null,noise=null;
function audio(){
  try{
    if(!AC){var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();
      var n=Math.floor(AC.sampleRate*0.4);noise=AC.createBuffer(1,n,AC.sampleRate);
      var d=noise.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1}
    if(AC.state==='suspended')AC.resume();
    return AC;
  }catch(e){return null}
}
function burst(type,f0,f1,vol,dur,delay){
  if(!S.sound)return;var a=audio();if(!a)return;
  try{
    var t=a.currentTime+(delay||0);
    var src=a.createBufferSource();src.buffer=noise;
    var f=a.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    var g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(f);f.connect(g);g.connect(a.destination);src.start(t);src.stop(t+dur+0.05);
  }catch(e){}
}
function bang(){
  burst('lowpass',5200,280,0.9,0.3);
  burst('bandpass',2600,2000,0.12,0.03,0.42);   /* casing hits the bench */
  if(!S.sound)return;var a=audio();if(!a)return;
  try{
    var t=a.currentTime,o=a.createOscillator(),g=a.createGain();
    o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(40,t+0.16);
    g.gain.setValueAtTime(0.8,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+0.22);
  }catch(e){}
}
function click(){burst('bandpass',3200,2400,0.35,0.04)}
function reloadSound(){burst('bandpass',1800,1200,0.4,0.06);burst('bandpass',2600,1500,0.5,0.07,0.55)}

/* ---------- actions ---------- */
function freshTarget(){S.holes=[];S.pops=[]}
function resetStats(){S.score=0;S.shots=0;S.hits=0;S.ammo=MAG;S.reload=0;S.brass=0;freshTarget();hud()}
function reload(){
  if(S.over||S.reload>0||S.ammo===MAG)return;
  S.reload=0.9;reloadSound();hud();
}
function shoot(){
  if(S.over||S.reload>0)return;
  if(S.ammo<=0){click();hud();return}
  var a=aimPoint(),g=geom();
  S.ammo--;S.shots++;S.kick=1;S.flash=1;bang();
  if(S.mz){
    S.fx.push({k:'case',x:S.mz.px,y:S.mz.py,vx:150+Math.random()*110,vy:-(230+Math.random()*90),rot:Math.random()*6,life:1});
    S.fx.push({k:'smoke',x:S.mz.x,y:S.mz.y,life:1});
  }
  var dx=a.x-g.x,dy=a.y-g.y,pts=0,onPaper=false;
  if(g.vis>0.5){
    onPaper=Math.abs(dx)<=g.hw&&Math.abs(dy)<=g.hh;
    var d=Math.hypot(dx,dy)/g.r;
    if(g.isImg){if(onPaper)pts=clamp(10-Math.floor(d*10),1,10)}
    else if(d<=1){pts=clamp(10-Math.floor(d*10),1,10)}
  }
  if(onPaper){S.holes.push({u:dx/g.r,v:dy/g.r});if(S.holes.length>80)S.holes.shift()}
  else{S.fx.push({k:'puff',x:a.x,y:a.y,life:1})}
  if(pts>0){
    S.hits++;S.score+=pts;
    S.pops.push({x:a.x,y:a.y,txt:'+'+pts,life:1,hit:true});
    if(S.mode==='pop'){S.pop.up=false;S.pop.t=0.45}
  }else{
    S.pops.push({x:a.x,y:a.y,txt:'MISS',life:1,hit:false});
  }
  hud();
}
function startRound(){S.over=false;$('over').hidden=true;resetStats();S.round=true;S.left=ROUND;hud()}
function stopRound(){S.round=false;S.over=false;$('over').hidden=true;S.left=ROUND;hud()}
function endRound(){
  S.round=false;S.over=true;S.left=0;
  var acc=S.shots?Math.round(S.hits/S.shots*100):0;
  var isBest=S.score>best;
  if(isBest){best=S.score;try{localStorage.setItem('targetmagic.best',String(best))}catch(e){}}
  $('oScore').textContent=S.score;
  $('oLine').textContent=S.hits+' hits from '+S.shots+' shots, '+acc+'% accuracy. '+(isBest&&S.score>0?'New best score.':'Best score: '+best+'.');
  $('over').hidden=false;hud();
  try{$('oAgain').focus()}catch(e){}
}

/* ---------- HUD ---------- */
var ammoEl=$('ammo');
for(var i=0;i<MAG;i++)ammoEl.appendChild(document.createElement('i'));
var lastTime='';
function hud(){
  $('sScore').textContent=S.score;
  $('sHits').textContent=S.hits+' / '+S.shots;
  $('sAcc').textContent=(S.shots?Math.round(S.hits/S.shots*100):0)+'%';
  var pips=ammoEl.children;
  for(var i=0;i<MAG;i++)pips[i].className=i<S.ammo?'':'spent';
  var h=$('hint'),msg='',alert=false;
  if(S.reload>0){msg='Reloading...'}
  else if(S.ammo<=0){msg='Empty. Press R or tap Reload.';alert=true}
  else if(S.round&&S.shots===0){msg='The clock starts on your first shot.'}
  else if(S.shots===0&&!S.over){msg='Move the mouse to aim. Click to shoot.'}
  h.hidden=!msg;h.textContent=msg;h.className='hint'+(alert?' alert':'');
  $('bRound').textContent=S.round?'Stop round':'Start 30-second round';
  timeHud();
}
function timeHud(){
  var t=S.round||S.over?S.left.toFixed(1):'--';
  if(t!==lastTime){lastTime=t;$('sTime').textContent=t}
}
function syncSeg(){
  var bs=document.querySelectorAll('[data-set]');
  for(var i=0;i<bs.length;i++){var b=bs[i];b.setAttribute('aria-pressed',String(S[b.dataset.set])===b.dataset.val?'true':'false')}
  $('bSway').setAttribute('aria-pressed',S.sway?'true':'false');
  $('bSound').setAttribute('aria-pressed',S.sound?'true':'false');
  $('tChange').hidden=!S.img;
}

/* ---------- drawing helpers ---------- */
function quad(a,b,c,d,e,f,g,h){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.lineTo(g,h);ctx.closePath()}
function line(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}
function rr(x,y,w,h,rad){ctx.beginPath();ctx.moveTo(x+rad,y);ctx.lineTo(x+w-rad,y);ctx.quadraticCurveTo(x+w,y,x+w,y+rad);ctx.lineTo(x+w,y+h-rad);ctx.quadraticCurveTo(x+w,y+h,x+w-rad,y+h);ctx.lineTo(x+rad,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-rad);ctx.lineTo(x,y+rad);ctx.quadraticCurveTo(x,y,x+rad,y);ctx.closePath()}

/* ---------- the range ---------- */
function drawScene(g){
  var i,z,c,sg,y,u;
  ctx.fillStyle='#0c100f';ctx.fillRect(0,0,W,H);
  var bx0=PX(-HWc,ZB),bx1=PX(HWc,ZB),by0=PY(-CRc,ZB),by1=PY(FDc,ZB);
  /* back wall: steel bullet trap */
  var bg=ctx.createLinearGradient(0,by0,0,by1);bg.addColorStop(0,'#566159');bg.addColorStop(0.5,'#2b3330');bg.addColorStop(1,'#0f1312');
  ctx.fillStyle=bg;ctx.fillRect(bx0,by0,bx1-bx0,by1-by0);
  ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1;
  for(i=1;i<7;i++){y=by0+(by1-by0)*i/7;line(bx0,y,bx1,y)}
  /* concrete floor */
  var fg=ctx.createLinearGradient(0,by1,0,H);fg.addColorStop(0,'#737c75');fg.addColorStop(0.3,'#666f69');fg.addColorStop(1,'#333a37');
  ctx.fillStyle=fg;quad(bx0,by1,bx1,by1,PX(HWc,ZN),PY(FDc,ZN),PX(-HWc,ZN),PY(FDc,ZN));ctx.fill();
  ctx.strokeStyle='rgba(13,17,16,0.4)';ctx.lineWidth=2;
  var edges=[-3.9,-1.3,1.3,3.9];
  for(i=0;i<edges.length;i++)line(PX(edges[i],ZB),by1,PX(edges[i],ZN),PY(FDc,ZN));
  /* yard lines painted across the floor */
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  for(i=0;i<DIST.length;i++){
    z=DIST[i];u=K/z;y=PY(FDc,z);
    ctx.strokeStyle='rgba(207,166,80,0.8)';ctx.lineWidth=Math.max(1,u*0.07);line(PX(-HWc,z),y,PX(HWc,z),y);
    if(u*0.9>=7){
      ctx.fillStyle='rgba(207,166,80,0.7)';ctx.font=Math.round(u*0.9)+'px "Saira Stencil One",Impact,sans-serif';
      for(c=-1;c<=1;c+=2){ctx.save();ctx.translate(PX(c*2.6,z),y-u*0.14);ctx.scale(1,0.42);ctx.fillText(String(z),0,0);ctx.restore()}
    }
  }
  /* ceiling and the target-carrier rails */
  ctx.fillStyle='#111615';quad(bx0,by0,bx1,by0,PX(HWc,ZN),PY(-CRc,ZN),PX(-HWc,ZN),PY(-CRc,ZN));ctx.fill();
  ctx.strokeStyle='#3d4844';ctx.lineWidth=1.5;
  for(i=0;i<LANES.length;i++)line(PX(LANES[i],ZB),by0,PX(LANES[i],ZN),PY(-CRc,ZN));
  /* side walls: acoustic panels above, rubber below, red safety stripe */
  for(sg=-1;sg<=1;sg+=2){
    var wx=sg*HWc,wg=ctx.createLinearGradient(sg<0?0:W,0,PX(wx,ZB),0);wg.addColorStop(0,'#1a211f');wg.addColorStop(1,'#46534d');
    ctx.fillStyle=wg;quad(PX(wx,ZN),PY(-CRc,ZN),PX(wx,ZB),by0,PX(wx,ZB),by1,PX(wx,ZN),PY(FDc,ZN));ctx.fill();
    ctx.fillStyle='rgba(13,17,16,0.4)';quad(PX(wx,ZN),PY(1.3,ZN),PX(wx,ZB),PY(1.3,ZB),PX(wx,ZB),by1,PX(wx,ZN),PY(FDc,ZN));ctx.fill();
    ctx.strokeStyle='#b34b2c';ctx.lineWidth=2;line(PX(wx,ZN),PY(1.3,ZN),PX(wx,ZB),PY(1.3,ZB));
    ctx.strokeStyle='rgba(0,0,0,0.28)';ctx.lineWidth=1;line(PX(wx,ZN),PY(-1.3,ZN),PX(wx,ZB),PY(-1.3,ZB));
    for(i=0;i<SEAMS.length;i++){z=SEAMS[i];line(PX(wx,z),PY(-CRc,z),PX(wx,z),PY(FDc,z))}
    for(i=0;i<DIST.length;i++){            /* yard placards */
      z=DIST[i];var z2=z*1.1,xa=PX(wx,z),xb=PX(wx,z2),h=0.7*K/z;
      ctx.fillStyle=BRASS;quad(xa,PY(-0.9,z),xb,PY(-0.9,z2),xb,PY(-0.2,z2),xa,PY(-0.2,z));ctx.fill();
      if(h*0.62>=7){ctx.fillStyle=INKC;ctx.font='700 '+Math.round(h*0.62)+'px "Saira Condensed",Arial,sans-serif';ctx.textBaseline='middle';
        ctx.fillText(String(z),(xa+xb)/2,PY(-0.55,z*1.05));ctx.textBaseline='alphabetic'}
    }
  }
  /* ceiling baffles with strip lights, far to near */
  for(i=0;i<BAFF.length;i++){
    z=BAFF[i];u=K/z;var y0=PY(-CRc,z),y1=PY(-CRc+0.5,z);if(y1<0)continue;
    var x0=PX(-HWc,z),x1=PX(HWc,z),bf=ctx.createLinearGradient(0,y0,0,y1);bf.addColorStop(0,'#1c2422');bf.addColorStop(1,'#33403b');
    ctx.fillStyle=bf;ctx.fillRect(x0,y0,x1-x0,y1-y0);
    ctx.strokeStyle='#5f6c66';ctx.lineWidth=1;line(x0,y1,x1,y1);
    if(i%2===0){
      ctx.save();ctx.shadowColor='rgba(244,240,220,0.85)';ctx.shadowBlur=clamp(u*0.6,4,22);ctx.fillStyle='#f6f2de';
      for(c=0;c<LANES.length;c++)ctx.fillRect(PX(LANES[c]-0.8,z),y1,1.6*u,Math.max(1.5,u*0.08));
      ctx.restore();
    }
  }
  /* downrange haze */
  var hz=ctx.createRadialGradient(V.x,V.y,0,V.x,V.y,Math.max(W,H)*0.5);hz.addColorStop(0,'rgba(235,229,211,0.13)');hz.addColorStop(1,'rgba(235,229,211,0)');
  ctx.fillStyle=hz;ctx.fillRect(0,0,W,H);
  /* target carrier (or a floor stand for pop-ups) */
  if(S.mode==='pop'){
    if(g.vis>0.03){ctx.strokeStyle='#262d2b';ctx.lineWidth=Math.max(1.5,g.u*0.1);line(g.x,g.y,g.x,PY(FDc,S.z))}
  }else{
    var top=PY(-CRc,S.z);
    for(i=0;i<BAFF.length;i++)if(BAFF[i]<S.z-0.5){top=Math.max(top,PY(-CRc+0.5,BAFF[i]));break}
    ctx.strokeStyle='#8a968f';ctx.lineWidth=Math.max(1,g.u*0.045);
    line(g.x,top,g.x,g.y-g.hh-g.u*0.1);line(g.x-g.hw*0.6,g.y-g.hh-g.u*0.1,g.x+g.hw*0.6,g.y-g.hh-g.u*0.1);
    ctx.fillStyle=BRASS;var cw=Math.max(2,g.u*0.09);
    ctx.fillRect(g.x-g.hw*0.6-cw/2,g.y-g.hh-g.u*0.14,cw,g.u*0.2);ctx.fillRect(g.x+g.hw*0.6-cw/2,g.y-g.hh-g.u*0.14,cw,g.u*0.2);
  }
}
function paintTarget(r,rx,ry,isImg,minHole){
  var hw=r*rx,hh=r*ry,i;
  ctx.fillStyle=PAPER;ctx.fillRect(-hw,-hh,hw*2,hh*2);
  ctx.shadowColor='transparent';
  if(isImg){
    try{ctx.drawImage(S.img,-hw,-hh,hw*2,hh*2)}catch(e){}
    ctx.strokeStyle=PAPER;ctx.lineWidth=Math.max(1,r*0.02);ctx.strokeRect(-hw,-hh,hw*2,hh*2);
  }else{
    ctx.fillStyle=INKC;ctx.beginPath();ctx.arc(0,0,r*0.4,0,TAU);ctx.fill();
    ctx.lineWidth=Math.max(0.5,r*0.008);
    for(i=1;i<=10;i++){
      if(i===7)continue;
      ctx.strokeStyle=i<7?INKC:PAPER;ctx.beginPath();ctx.arc(0,0,r*(11-i)/10,0,TAU);ctx.stroke();
    }
    if(r>52){
      ctx.font='600 '+Math.round(r*0.07)+'px "Saira Condensed",Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      for(var n=1;n<=9;n++){ctx.fillStyle=n<7?INKC:PAPER;var q=r*(10.5-n)/10;ctx.fillText(n,q,0);ctx.fillText(n,-q,0);ctx.fillText(n,0,q);ctx.fillText(n,0,-q)}
    }
    ctx.fillStyle=HOT;ctx.beginPath();ctx.arc(0,0,Math.max(0.8,r*0.012),0,TAU);ctx.fill();
  }
  var hr=Math.max(minHole,r*0.033);
  for(i=0;i<S.holes.length;i++){
    var o=S.holes[i];
    ctx.fillStyle='#070909';ctx.beginPath();ctx.arc(o.u*r,o.v*r,hr,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(235,229,211,0.55)';ctx.lineWidth=Math.min(1,hr*0.4);ctx.beginPath();ctx.arc(o.u*r,o.v*r,hr+0.6,0,TAU);ctx.stroke();
  }
}
function drawTarget(g){
  if(g.vis<0.03)return;
  ctx.save();ctx.translate(g.x,g.y);
  if(S.mode==='pop')ctx.scale(1,g.vis);
  ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=Math.max(4,g.r*0.3);ctx.shadowOffsetY=Math.max(1,g.r*0.08);
  paintTarget(g.r,g.hw/g.r,g.hh/g.r,g.isImg,1.3);
  ctx.restore();
}
function drawBooth(){
  var pw=W*0.05,by=H*0.9,i,sg;
  var vg=ctx.createRadialGradient(V.x,V.y,Math.min(W,H)*0.35,V.x,V.y,Math.max(W,H)*0.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  for(sg=0;sg<2;sg++){                    /* booth partitions */
    var x=sg?W-pw:0,pg=ctx.createLinearGradient(x,0,x+pw,0);pg.addColorStop(sg?1:0,'#0a0d0c');pg.addColorStop(sg?0:1,'#1b2220');
    ctx.fillStyle=pg;ctx.fillRect(x,0,pw,H);
    ctx.strokeStyle='#48544f';ctx.lineWidth=2;line(sg?x:x+pw,0,sg?x:x+pw,by);
  }
  var bg=ctx.createLinearGradient(0,by,0,H);bg.addColorStop(0,'#252d2a');bg.addColorStop(1,'#0e1211'); /* shooting bench */
  ctx.fillStyle=bg;ctx.fillRect(0,by,W,H-by);
  ctx.strokeStyle='#5b6761';ctx.lineWidth=2;line(0,by,W,by);
  for(i=0;i<S.brass;i++){                 /* spent brass */
    var fx=(i*0.618)%1,fy=(i*0.371)%1;
    ctx.save();ctx.translate(W*(0.6+fx*0.32),by+(H-by)*(0.3+fy*0.5));ctx.rotate(fx*6);
    ctx.fillStyle=BRASS;ctx.fillRect(-5,-2,10,4);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(3,-2,2,4);ctx.restore();
  }
}

/* ---------- the pistol: two-handed grip seen from behind the sights ---------- */
function glove(cx,cy,r){var g=ctx.createRadialGradient(cx,cy,2,cx,cy,r);g.addColorStop(0,'#525b57');g.addColorStop(1,'#1f2524');return g}
function thumb(x0,y0,w0,x1,y1,w1,shade){
  var dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy),nx=-dy/l,ny=dx/l,p,e;
  for(p=0;p<2;p++){
    e=p?0:1.8;ctx.fillStyle=p?shade:'#0f1312';
    quad(x0+nx*(w0/2+e),y0+ny*(w0/2+e),x1+nx*(w1/2+e),y1+ny*(w1/2+e),x1-nx*(w1/2+e),y1-ny*(w1/2+e),x0-nx*(w0/2+e),y0-ny*(w0/2+e));ctx.fill();
    ctx.beginPath();ctx.arc(x1,y1,w1/2+e,0,TAU);ctx.fill();
  }
  ctx.strokeStyle='rgba(235,229,211,0.13)';ctx.lineWidth=3;ctx.lineCap='round';line(x0+nx*w0*0.2+dx*0.15,y0+ny*w0*0.2+dy*0.15,x1+nx*w1*0.2,y1+ny*w1*0.2);ctx.lineCap='butt';
  ctx.strokeStyle='rgba(0,0,0,0.45)';ctx.lineWidth=1.3;
  var mx=x0+dx*0.55,my=y0+dy*0.55,hw=(w0+w1)/4-1;line(mx+nx*hw,my+ny*hw,mx-nx*hw,my-ny*hw);
}
function drawGun(a){
  var s=clamp(Math.min(W,H)/550,0.6,1.5);
  var k=reduce?S.kick*0.3:S.kick;
  var gx=W/2+(a.x-W/2)*0.62;
  var rl=S.reload>0?Math.sin(clamp((0.9-S.reload)/0.9,0,1)*Math.PI)*130*s:0;
  var by=H+92*s+(a.y-V.y)*0.2+k*10*s+rl;
  var ang=Math.atan2(a.x-gx,Math.max(120*s,by-a.y))*0.85-k*0.02;
  var sn=Math.sin(ang),cs=Math.cos(ang);
  S.mz={x:gx+sn*352*s,y:by-cs*352*s,px:gx+sn*290*s+cs*20*s,py:by-cs*290*s+sn*20*s};
  var i,g,sy=k*9;
  ctx.save();ctx.translate(gx,by);ctx.rotate(ang);ctx.scale(s,s);

  /* muzzle flash behind the sights */
  if(S.flash>0.05){
    var fr=28+70*S.flash,fgd=ctx.createRadialGradient(0,-352,0,0,-352,fr);
    fgd.addColorStop(0,'rgba(255,246,220,0.98)');fgd.addColorStop(0.3,'rgba(246,160,70,0.8)');fgd.addColorStop(1,'rgba(238,106,46,0)');
    ctx.fillStyle=fgd;ctx.beginPath();ctx.arc(0,-352,fr,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,240,200,'+(0.8*S.flash)+')';ctx.beginPath();
    for(i=0;i<10;i++){var rad=i%2?fr*0.22:fr*(0.75+0.25*((i*37)%5)/5),an=i/10*TAU+0.3;ctx.lineTo(Math.sin(an)*rad,-352-Math.cos(an)*rad)}
    ctx.closePath();ctx.fill();
  }

  /* sleeves */
  g=ctx.createLinearGradient(-200,0,-10,0);g.addColorStop(0,'#101615');g.addColorStop(1,'#2d3a36');ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(-60,-84);ctx.quadraticCurveTo(-125,-60,-225,70);ctx.lineTo(-80,70);ctx.quadraticCurveTo(-46,10,-10,-40);ctx.closePath();ctx.fill();
  g=ctx.createLinearGradient(10,0,210,0);g.addColorStop(0,'#2d3a36');g.addColorStop(1,'#101615');ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(52,-88);ctx.quadraticCurveTo(125,-60,230,70);ctx.lineTo(86,70);ctx.quadraticCurveTo(56,10,14,-40);ctx.closePath();ctx.fill();

  /* support-hand fingertips wrapped around the front */
  for(i=0;i<4;i++){
    ctx.fillStyle=glove(56,-164+i*21,16);ctx.strokeStyle='#0f1312';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(53+(i===3?-3:0),-162+i*21,13,11,0,0,TAU);ctx.fill();ctx.stroke();
  }
  /* shooting hand, web high under the beavertail */
  ctx.fillStyle=glove(18,-128,74);ctx.strokeStyle='#0f1312';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-22,-178);ctx.bezierCurveTo(-6,-190,18,-190,34,-174);ctx.bezierCurveTo(50,-160,55,-140,55,-116);
  ctx.bezierCurveTo(55,-90,52,-70,58,-44);ctx.lineTo(72,-6);ctx.lineTo(-4,-6);ctx.bezierCurveTo(-14,-50,-26,-90,-26,-130);ctx.bezierCurveTo(-27,-150,-26,-168,-22,-178);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(6,-184);ctx.bezierCurveTo(22,-150,20,-100,30,-50);ctx.stroke();
  for(i=0;i<3;i++){ctx.beginPath();ctx.arc(40,-150+i*24,9,-0.9,0.9);ctx.stroke()}
  ctx.fillStyle='#141918';rr(-12,-46,70,22,4);ctx.fill();
  ctx.fillStyle='#3a4340';ctx.fillRect(30,-42,22,14);
  /* support hand heel on the left grip panel */
  ctx.fillStyle=glove(-50,-128,70);ctx.strokeStyle='#0f1312';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-24,-170);ctx.bezierCurveTo(-56,-180,-80,-156,-80,-122);ctx.bezierCurveTo(-80,-92,-72,-70,-76,-44);ctx.lineTo(-90,-6);ctx.lineTo(-12,-6);
  ctx.bezierCurveTo(-16,-60,-20,-110,-22,-150);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#141918';rr(-74,-46,62,22,4);ctx.fill();
  /* thumbs stacked forward along the frame */
  thumb(-58,-150,22,-50,-212,14,'#39423f');
  thumb(-36,-172,22,-40,-236,14,'#48524e');

  /* frame and beavertail */
  ctx.fillStyle='#131716';ctx.beginPath();ctx.moveTo(-27,-198);ctx.lineTo(27,-198);ctx.lineTo(27,-182);ctx.bezierCurveTo(27,-168,12,-163,0,-163);ctx.bezierCurveTo(-12,-163,-27,-168,-27,-182);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(235,229,211,0.12)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-20,-170);ctx.quadraticCurveTo(0,-162,20,-170);ctx.stroke();

  ctx.save();ctx.translate(0,sy);
  /* slide: bevels, top with serrated rib, ejection port */
  ctx.fillStyle='#262d2b';quad(-31,-242,-25,-250,-17,-338,-21,-333);ctx.fill();
  ctx.fillStyle='#262d2b';quad(31,-242,25,-250,17,-338,21,-333);ctx.fill();
  g=ctx.createLinearGradient(-25,0,25,0);g.addColorStop(0,'#5a6561');g.addColorStop(0.3,'#434c49');g.addColorStop(0.7,'#434c49');g.addColorStop(1,'#66716d');
  ctx.fillStyle=g;quad(-25,-250,25,-250,17,-338,-17,-338);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.38)';ctx.lineWidth=1;
  for(i=0;i<22;i++){var t=i/21,yy=-256-t*78,hwd=6.5-t*2;line(-hwd,yy,hwd,yy)}
  ctx.fillStyle='#090b0b';quad(7,-272,23.5,-272,20.5,-306,6,-306);ctx.fill();
  g=ctx.createLinearGradient(8,0,22,0);g.addColorStop(0,'#737c78');g.addColorStop(0.5,'#b4bcb8');g.addColorStop(1,'#6b7470');
  ctx.fillStyle=g;quad(9,-277,21.5,-277,19,-301,8,-301);ctx.fill();
  /* front sight */
  ctx.fillStyle='#0b0e0d';ctx.fillRect(-4,-350,8,14);
  ctx.fillStyle=HOT;ctx.beginPath();ctx.arc(0,-344,2.5,0,TAU);ctx.fill();
  /* rear face of the slide */
  g=ctx.createLinearGradient(0,-250,0,-196);g.addColorStop(0,'#4b5551');g.addColorStop(1,'#191e1d');ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(-31,-196);ctx.lineTo(-31,-242);ctx.lineTo(-25,-250);ctx.lineTo(25,-250);ctx.lineTo(31,-242);ctx.lineTo(31,-196);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(235,229,211,0.28)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-31,-242);ctx.lineTo(-25,-250);ctx.lineTo(25,-250);ctx.lineTo(31,-242);ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,0.5)';
  for(i=0;i<5;i++){line(-29.5+i*2.4,-238,-29.5+i*2.4,-202);line(29.5-i*2.4,-238,29.5-i*2.4,-202)}
  ctx.fillStyle='#222827';rr(-12,-240,24,37,3);ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.stroke();
  ctx.fillStyle='#0a0c0c';ctx.beginPath();ctx.arc(0,-222,3.6,0,TAU);ctx.fill();
  ctx.strokeStyle='#737c78';ctx.beginPath();ctx.arc(0,-222,3.6,0,TAU);ctx.stroke();
  /* rear sight: notch and two dots */
  ctx.fillStyle='#0b0e0d';ctx.beginPath();ctx.moveTo(-22,-250);ctx.lineTo(-22,-264);ctx.lineTo(-6,-264);ctx.lineTo(-6,-255);ctx.lineTo(6,-255);ctx.lineTo(6,-264);ctx.lineTo(22,-264);ctx.lineTo(22,-250);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(235,229,211,0.22)';ctx.beginPath();ctx.moveTo(-22,-264);ctx.lineTo(-6,-264);ctx.moveTo(6,-264);ctx.lineTo(22,-264);ctx.stroke();
  ctx.fillStyle=PAPER;ctx.beginPath();ctx.arc(-14,-258,2.3,0,TAU);ctx.arc(14,-258,2.3,0,TAU);ctx.fill();
  ctx.restore();
  ctx.restore();
}
function drawFx(){
  var i,p;
  for(i=0;i<S.fx.length;i++){
    p=S.fx[i];
    if(p.k==='case'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=BRASS;ctx.fillRect(-6,-2.5,12,5);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(3,-2.5,3,5);ctx.restore()}
    else if(p.k==='smoke'){ctx.fillStyle='rgba(235,229,211,'+(p.life*0.2)+')';ctx.beginPath();ctx.arc(p.x,p.y,10+(1-p.life)*30,0,TAU);ctx.fill()}
    else{ctx.strokeStyle='rgba(235,229,211,'+(p.life*0.6)+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,2+(1-p.life)*9,0,TAU);ctx.stroke()}
  }
}
function drawScope(g){
  if(g.r>=50)return;
  var R=clamp(Math.min(W,H)*0.14,46,78),cx=W-W*0.05-14-R,cy=54+R;
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fillStyle='#0a0d0c';ctx.fill();ctx.clip();
  if(g.vis>0.5){ctx.translate(cx,cy);paintTarget(R*0.62,g.hw/g.r,g.hh/g.r,g.isImg,2)}
  ctx.restore();
  ctx.strokeStyle='#0d1110';ctx.lineWidth=7;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();
  ctx.strokeStyle=BRASS;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R+2,0,TAU);ctx.stroke();
  ctx.font='600 13px "Saira Condensed",Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
  ctx.lineWidth=3;ctx.strokeStyle='rgba(13,17,16,0.85)';ctx.strokeText('SPOTTING SCOPE',cx,cy+R+8);
  ctx.fillStyle=PAPER;ctx.fillText('SPOTTING SCOPE',cx,cy+R+8);
}
function drawCross(a){
  var c=S.ammo>0&&S.reload<=0?HOT:'#9aa69f';
  ctx.save();ctx.translate(a.x,a.y);
  for(var p=0;p<2;p++){
    ctx.strokeStyle=p===0?'rgba(13,17,16,0.85)':c;ctx.lineWidth=p===0?3.5:1.5;
    ctx.beginPath();ctx.arc(0,0,12,0,TAU);
    ctx.moveTo(-21,0);ctx.lineTo(-6,0);ctx.moveTo(6,0);ctx.lineTo(21,0);ctx.moveTo(0,-21);ctx.lineTo(0,-6);ctx.moveTo(0,6);ctx.lineTo(0,21);ctx.stroke();
  }
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,1.3,0,TAU);ctx.fill();
  ctx.restore();
}
function drawPops(){
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var i=0;i<S.pops.length;i++){
    var p=S.pops[i];ctx.globalAlpha=clamp(p.life*1.6,0,1);
    ctx.font='700 '+(p.hit?26:17)+'px "Saira Condensed",Arial,sans-serif';
    var y=p.y-30-(1-p.life)*34;
    ctx.lineWidth=4;ctx.strokeStyle='rgba(13,17,16,0.85)';ctx.strokeText(p.txt,p.x,y);
    ctx.fillStyle=p.hit?BRASS:'#9aa69f';ctx.fillText(p.txt,p.x,y);
  }
  ctx.globalAlpha=1;
}

/* ---------- loop ---------- */
var last=0;
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000||0),i,p;last=now;S.t+=dt;
  S.kick=Math.max(0,S.kick-dt*5.5);S.flash=Math.max(0,S.flash-dt*14);
  S.z+=(DIST[S.dist]-S.z)*Math.min(1,dt*3.2);            /* the carrier runs the target down the lane */
  if(S.reload>0){S.reload-=dt;if(S.reload<=0){S.reload=0;S.ammo=MAG;hud()}}
  if(S.mode==='pop'){
    var P=S.pop;P.t-=dt;
    if(P.t<=0){
      if(P.up){P.up=false;P.t=0.45}
      else{P.x=Math.random()*2-1;P.y=-0.9+Math.random()*2.2;P.up=true;P.t=1.9;S.holes=[]}
    }
    P.vis=clamp(P.vis+(P.up?1:-1)*dt*8,0,1);
  }
  for(i=S.pops.length-1;i>=0;i--){S.pops[i].life-=dt*1.3;if(S.pops[i].life<=0)S.pops.splice(i,1)}
  for(i=S.fx.length-1;i>=0;i--){
    p=S.fx[i];
    if(p.k==='case'){p.vy+=950*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=14*dt;if(p.y>H*0.94&&p.vy>0){S.fx.splice(i,1);S.brass=Math.min(18,S.brass+1)}}
    else{p.life-=dt*(p.k==='smoke'?1.5:2.6);if(p.k==='smoke')p.y-=22*dt;if(p.life<=0)S.fx.splice(i,1)}
  }
  if(S.round&&S.shots>0){S.left-=dt;if(S.left<=0)endRound()}
  timeHud();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  frameGeom();
  var g=geom(),a=aimPoint();
  drawScene(g);drawTarget(g);drawBooth();
  if(S.flash>0.05){ctx.fillStyle='rgba(255,226,170,'+(0.09*S.flash)+')';ctx.fillRect(0,0,W,H)}
  drawPops();drawGun(a);drawFx();drawScope(g);drawCross(a);
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
function setM(e){var r=cv.getBoundingClientRect();M.x=clamp(e.clientX-r.left,0,W);M.y=clamp(e.clientY-r.top,0,H)}
cv.addEventListener('pointermove',setM);
cv.addEventListener('pointerdown',function(e){e.preventDefault();setM(e);shoot()});
document.addEventListener('keydown',function(e){if((e.key==='r'||e.key==='R')&&!e.ctrlKey&&!e.metaKey&&!e.altKey)reload()});
var sets=document.querySelectorAll('[data-set]');
for(var b=0;b<sets.length;b++)sets[b].addEventListener('click',function(){
  var k=this.dataset.set,v=this.dataset.val;
  if(k==='dist')v=+v;
  if(k==='target'&&v==='img'&&!S.img){$('file').click();return}
  S[k]=v;freshTarget();
  if(k==='mode'){S.pop.up=true;S.pop.t=1.9;S.pop.vis=1;S.pop.x=0;S.pop.y=0}
  syncSeg();
});
$('tChange').addEventListener('click',function(){$('file').click()});
$('file').addEventListener('change',function(){
  var f=this.files&&this.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){var im=new Image();im.onload=function(){S.img=im;S.target='img';freshTarget();syncSeg()};im.src=rd.result};
  rd.readAsDataURL(f);this.value='';
});
$('bSway').addEventListener('click',function(){S.sway=!S.sway;syncSeg()});
$('bSound').addEventListener('click',function(){S.sound=!S.sound;syncSeg()});
$('bReload').addEventListener('click',reload);
$('bClear').addEventListener('click',function(){freshTarget()});
$('bRound').addEventListener('click',function(){if(S.round)stopRound();else startRound()});
$('oAgain').addEventListener('click',startRound);
$('oPractice').addEventListener('click',function(){stopRound();resetStats()});

frameGeom();syncSeg();hud();requestAnimationFrame(frame);
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
