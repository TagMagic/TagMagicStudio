<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<title>StrideMagic</title>
<link rel="icon" type="image/png" href="wizard.png">
<link rel="apple-touch-icon" href="wizard.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --green:#0e3b2c; --green2:#16553f; --gold:#d8b04a; --gold2:#f3d67a;
  --burg:#7c1d2b; --cream:#f5ecd6; --ink:#1b140e; --teal:#3fc1c1; --amber:#ffc857;
  --panel:rgba(12,32,25,.92);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Josefin Sans',system-ui,sans-serif; font-size:17px; color:var(--cream);
  background:url('background.png') center/cover fixed no-repeat, radial-gradient(ellipse at top,#1e5a44,#071a13 70%);
  background-color:#0b241b;
}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(6,18,13,.45),rgba(6,18,13,.72));pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:10px 16px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:6px}
.brand img.wiz{height:84px;width:84px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.brand img.logo{height:70px;max-width:60vw;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.brand .logotext{font-family:Limelight,serif;font-size:42px;color:var(--gold2);text-shadow:0 3px 0 #6b4a10,0 6px 14px rgba(0,0,0,.6)}
@media (max-width:640px){.brand img.wiz{height:60px;width:60px}.brand img.logo{height:52px}}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  font-family:'Josefin Sans',sans-serif;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#a8822a);
  border:2px solid #6b4a10;border-radius:6px;padding:10px 16px;cursor:pointer;
  box-shadow:0 3px 0 #5a3d0c,0 6px 12px rgba(0,0,0,.35);transition:transform .08s,filter .15s
}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #5a3d0c}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{font-size:13px;padding:7px 11px}
.btn.big{font-size:20px;padding:14px 26px}
.btn.green{background:linear-gradient(180deg,#5fd3a0,#2a9c6c 55%,#1c6e4c);border-color:#0d3b28;color:#04170f;box-shadow:0 3px 0 #0d3b28,0 6px 12px rgba(0,0,0,.35)}
.btn.red{background:linear-gradient(180deg,#e48a8a,#b33a44 55%,#7c1d2b);border-color:#3d0a12;color:#fff;box-shadow:0 3px 0 #3d0a12,0 6px 12px rgba(0,0,0,.35)}
.btn.teal{background:linear-gradient(180deg,#9ee8e8,#3fc1c1 55%,#25807f);border-color:#0f3e3e;color:#04191a;box-shadow:0 3px 0 #0f3e3e,0 6px 12px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(0,0,0,.25);color:var(--gold2);border-color:var(--gold);box-shadow:none}
.btn.sel{outline:3px solid var(--teal);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;margin-top:10px}
@media (max-width:1020px){.main{grid-template-columns:1fr}}
.panel{
  background:var(--panel);border:2px solid var(--gold);border-radius:6px;padding:12px;
  box-shadow:0 0 0 4px rgba(12,32,25,.9),0 0 0 5px rgba(216,176,74,.45),0 12px 30px rgba(0,0,0,.5)
}
h2.deco{font-family:Limelight,serif;color:var(--gold2);font-weight:400;font-size:20px;letter-spacing:.08em;text-align:center;margin:2px 0 10px;display:flex;align-items:center;gap:10px}
h2.deco::before,h2.deco::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.trackwrap{width:100%;position:relative}
canvas#track{display:block;width:100%}
.standings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:640px){.standings{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip{background:rgba(0,0,0,.3);border:1px solid rgba(216,176,74,.5);border-radius:6px;padding:7px 8px;font-size:14px;line-height:1.3}
.chip.me{border-color:var(--gold2);box-shadow:0 0 10px rgba(243,214,122,.35)}
.chip .top{display:flex;align-items:center;gap:7px;font-weight:700}
.num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-weight:700;font-size:14px;border:2px solid;flex:none}
.chip .sub{opacity:.9;font-size:13px}
.chip .status{color:#ffb3b3;font-size:12.5px}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#25807f,var(--teal))}
.turninfo{text-align:center;font-weight:700;font-size:18px;color:var(--gold2);margin-bottom:4px;min-height:24px}
.myrig{text-align:center;font-size:14px;opacity:.9;margin-bottom:8px}
.dicezone{background:rgba(0,0,0,.25);border:1px solid rgba(216,176,74,.35);border-radius:8px;padding:12px 8px 30px;min-height:120px}
.dice{display:flex;gap:14px;justify-content:center;align-items:center;min-height:72px;margin-bottom:26px}
.die{width:66px;height:66px;position:relative;perspective:420px;cursor:default;transition:transform .15s,opacity .15s,filter .15s}
.die::after{content:"";position:absolute;left:8%;right:8%;bottom:-9px;height:9px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%);z-index:-1}
.die.click{cursor:pointer}
.die.click:hover{transform:translateY(-3px)}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(var(--fx)) rotateY(var(--fy))}
.die.rolling .cube{animation:tumble .85s cubic-bezier(.18,.75,.32,1) both}
@keyframes tumble{0%{transform:translateY(-26px) rotateX(var(--sx)) rotateY(var(--sy))}55%{transform:translateY(5px) rotateX(calc(var(--fx) + (var(--sx) - var(--fx))*.12)) rotateY(calc(var(--fy) + (var(--sy) - var(--fy))*.12))}75%{transform:translateY(-4px) rotateX(var(--fx)) rotateY(var(--fy))}100%{transform:translateY(0) rotateX(var(--fx)) rotateY(var(--fy))}}
.face{position:absolute;inset:0;border-radius:11px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11px;backface-visibility:hidden;
  background:linear-gradient(135deg,#c9a24a 0 7px,transparent 7.5px),linear-gradient(225deg,#c9a24a 0 7px,transparent 7.5px),linear-gradient(45deg,#c9a24a 0 7px,transparent 7.5px),linear-gradient(315deg,#c9a24a 0 7px,transparent 7.5px),radial-gradient(circle at 32% 28%,#ffffff,#fffdf6 55%,#f6efdc);
  box-shadow:inset 0 0 0 2px #a8822a,inset 0 0 0 4px #f6ecd2,inset 0 0 0 5px rgba(168,130,42,.8),inset 0 -3px 6px rgba(150,120,60,.14),inset 0 3px 5px rgba(255,255,255,.9)}
.f1{transform:translateZ(33px)} .f6{transform:rotateY(180deg) translateZ(33px)} .f2{transform:rotateY(90deg) translateZ(33px)}
.f5{transform:rotateY(-90deg) translateZ(33px)} .f3{transform:rotateX(90deg) translateZ(33px)} .f4{transform:rotateX(-90deg) translateZ(33px)}
.pip{width:11px;height:11px;border-radius:50%;place-self:center;background:radial-gradient(circle at 38% 35%,#4a362a,#120a06 70%);box-shadow:inset 0 2px 2px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.8)}
.f1 .pip{width:19px;height:19px;background:radial-gradient(circle at 36% 32%,#ff8a8f,#c0242f 45%,#6b1019);box-shadow:0 0 0 2px #c9a24a,0 0 0 3px #6b4a10,inset 0 -2px 3px rgba(0,0,0,.4)}
.die.stride{transform:translateY(-6px);filter:drop-shadow(0 0 6px #f3d67a) drop-shadow(0 0 2px #f3d67a)}
.die.stam{transform:translateY(-6px);filter:drop-shadow(0 0 6px #3fc1c1) drop-shadow(0 0 2px #3fc1c1)}
.die.toss{opacity:.55}
.die.bust .face{background:radial-gradient(circle at 32% 28%,#ffe9e9,#f2c4c4 50%,#d99a9a)}
.die .tag{position:absolute;bottom:-27px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.die.stride .tag{color:var(--gold2)} .die.stam .tag{color:var(--teal)} .die.toss .tag{color:#bbb}
.hint{text-align:center;font-size:14.5px;opacity:.9;margin-top:6px;min-height:20px}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.actions .btn{flex:1 1 auto;min-width:110px}
.stam{margin-top:12px}
.stam .lbl{display:flex;justify-content:space-between;font-size:14.5px;font-weight:600}
.stam .bar{height:14px;border:1px solid rgba(63,193,193,.5)}
.perks{margin-top:8px;font-size:13.5px;text-align:center;color:var(--gold2);min-height:18px}
.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{font-family:inherit;background:linear-gradient(160deg,#1f5040,#0d2b20);border:2px solid var(--gold);border-radius:8px;padding:8px 6px 9px;text-align:center;color:var(--cream);cursor:pointer;min-height:118px;position:relative}
.card:hover:not(:disabled){filter:brightness(1.15)}
.card:disabled{opacity:.6;cursor:default}
.card .ic{font-size:26px;line-height:1.1;color:var(--gold2)}
.card .t{font-family:Limelight,serif;font-size:14px;color:var(--gold2);margin:2px 0}
.card .d{font-size:12.5px;line-height:1.25}
.card .play{position:absolute;left:0;right:0;bottom:-1px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink);background:var(--gold2);border-radius:0 0 6px 6px;padding:2px 0}
.card.empty{border-style:dashed;opacity:.35;cursor:default;display:flex;align-items:center;justify-content:center;font-size:13px}
.card.curse{background:linear-gradient(160deg,#661826,#2a0a10);border-color:#d98a93}
.card.curse .ic,.card.curse .t{color:#ffc9cf}
.bigcard{width:210px;min-height:250px;margin:6px auto 12px;padding:18px 14px;cursor:default;box-shadow:0 0 0 4px rgba(0,0,0,.35),0 0 30px rgba(243,214,122,.35)}
.bigcard .ic{font-size:56px}
.bigcard .t{font-size:22px;margin:8px 0}
.bigcard .d{font-size:16px}
.bigcard.curse{box-shadow:0 0 0 4px rgba(0,0,0,.35),0 0 30px rgba(220,80,90,.45)}
.tip{margin-top:8px;text-align:center;font-size:15px;color:var(--gold2)}
.tip span{display:inline-block;width:26px;height:26px;line-height:27px;border-radius:5px;background:radial-gradient(circle at 32% 28%,#fffaf0,#e6d4a6);box-shadow:inset 0 0 0 2px #a8822a;color:#1b140e;font-weight:700;margin:0 2px}
.caller{display:flex;gap:10px;align-items:flex-start}
.caller img{width:70px;height:70px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.bubble{flex:1;background:var(--cream);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:15.5px;line-height:1.35;position:relative;min-height:48px;font-weight:600}
.bubble::before{content:"";position:absolute;left:-9px;top:20px;border:9px solid transparent;border-left:0;border-right-color:var(--cream)}
.log{margin-top:10px;max-height:190px;overflow:auto;font-size:14.5px;line-height:1.4;padding-right:4px}
.log div{padding:3px 0;border-bottom:1px solid rgba(216,176,74,.15)}
.log div:first-child{color:var(--gold2)}
.side>.panel+.panel{margin-top:16px}
.overlay{position:fixed;inset:0;background:rgba(4,12,9,.8);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay[hidden]{display:none}
#modal{z-index:60}
.modal{max-width:560px;width:100%;max-height:94vh;overflow:auto}
.modal h3,.pre h3{font-family:Limelight,serif;font-weight:400;color:var(--gold2);font-size:28px;text-align:center;margin:4px 0 10px;letter-spacing:.05em}
.modal p{line-height:1.45;margin:8px 0}
.mbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13.5px;margin-top:8px;opacity:.95}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700}
table.res{width:100%;border-collapse:collapse;margin:8px 0;font-size:16px}
table.res td{padding:6px 4px;border-bottom:1px solid rgba(216,176,74,.25)}
table.res tr.me td{color:var(--gold2);font-weight:700}
.photo{background:linear-gradient(180deg,#cdb68a,#9c8456);color:#2b1f10;border:10px solid #f2e7cc;box-shadow:0 0 0 2px #6b5530,0 10px 30px rgba(0,0,0,.6);padding:12px;font-family:Georgia,serif;text-align:center;filter:sepia(.3)}
.photo .lane{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0;font-size:17px}
.howto h4{font-family:Limelight,serif;font-weight:400;color:var(--gold2);margin:14px 0 4px;font-size:18px}
.howto ul{margin:4px 0;padding-left:20px;line-height:1.45}

/* ---------- pre-race ---------- */
.pre .prewrap{max-width:1200px;width:100%;max-height:95vh;overflow:auto;padding:16px 18px 20px}
.stepbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:2px 0 12px}
.stepbar span{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;border:1px solid rgba(216,176,74,.45);border-radius:20px;opacity:.5}
.stepbar span.on{opacity:1;background:var(--gold);color:var(--ink)}
.stepbar span.done{opacity:.85;color:var(--gold2)}
.prehead{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.prehead img.lg{max-height:70px;max-width:60%;object-fit:contain}
.prehead img.wz{height:70px;width:70px;object-fit:contain}
.lead{text-align:center;max-width:760px;margin:0 auto 14px;line-height:1.45;opacity:.92}
.program{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media (max-width:820px){.program{grid-template-columns:1fr}}
.progcover{background:linear-gradient(170deg,#f3e7c7,#e0cf9f);color:#2b1f10;border:3px double #8a6a2a;border-radius:4px;padding:18px 20px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.progcover .ot{font-family:Limelight,serif;text-align:center;font-size:15px;letter-spacing:.3em;color:#7c1d2b}
.progcover .rn{font-family:Limelight,serif;text-align:center;font-size:34px;margin:6px 0 2px;color:#1b140e}
.progcover .cond{text-align:center;font-style:italic;font-size:15px;margin-bottom:10px;font-family:Georgia,serif}
.progcover table{width:100%;border-collapse:collapse;font-family:Georgia,serif;font-size:15.5px}
.progcover td{padding:5px 4px;border-bottom:1px dotted #8a6a2a}
.progcover td:last-child{text-align:right;font-weight:700}
.progcover .price{position:absolute;top:10px;right:14px;font-family:Georgia,serif;font-size:13px;color:#7c1d2b}
.tote{background:#0a1712;border:2px solid var(--gold);border-radius:6px;padding:10px;font-family:'Courier New',monospace;color:var(--amber);text-align:center;margin:0;text-shadow:0 0 6px rgba(255,200,80,.6)}
.tote b{font-size:22px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.entry{background:linear-gradient(170deg,#13392b,#0a2219);border:2px solid rgba(216,176,74,.6);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.entry:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.5)}
.entry .ph{position:relative;aspect-ratio:4/3;background:radial-gradient(#2a5a45,#0d2a1f);overflow:hidden}
.entry .ph img,.entry .ph canvas{width:100%;height:100%;object-fit:cover;display:block}
.pp{position:absolute;top:8px;left:8px;width:38px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;border:2px solid;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.mlbadge{position:absolute;top:8px;right:8px;background:#0a1712;color:var(--amber);font-family:'Courier New',monospace;font-weight:700;padding:4px 8px;border:1px solid var(--gold);border-radius:4px;font-size:14px;text-shadow:0 0 6px rgba(255,200,80,.6)}
.silkband{position:absolute;left:0;right:0;bottom:0;height:8px}
.entry .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.entry h4{font-family:Limelight,serif;font-weight:400;color:var(--gold2);font-size:22px;margin:0;line-height:1.1}
.entry .meta{font-size:13.5px;opacity:.85;line-height:1.35}
.stats{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px;align-items:center;margin-top:2px}
.stars{color:var(--gold2);letter-spacing:2px;font-size:15px;white-space:nowrap}
.stars i{font-style:normal;opacity:.22}
.perklist{margin:2px 0 0;padding-left:18px;font-size:13px;line-height:1.35;color:#cfe9dc}
.form{font-family:'Courier New',monospace;color:var(--amber);font-size:14px}
.quote{font-style:italic;font-size:14px;opacity:.9;font-family:Georgia,serif}
.entry .btn{margin-top:auto}
.style-tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:rgba(216,176,74,.18);color:var(--gold2)}
.betgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:860px){.betgrid{grid-template-columns:1fr}}
.toteboard{background:#081410;border:3px solid var(--gold);border-radius:8px;padding:12px;font-family:'Courier New',monospace;color:var(--amber);box-shadow:inset 0 0 30px rgba(0,0,0,.8)}
.toteboard .tt{display:flex;justify-content:space-between;font-weight:700;letter-spacing:.1em;font-size:14px;margin-bottom:8px;text-shadow:0 0 6px rgba(255,200,80,.6)}
.toteboard table{width:100%;border-collapse:collapse}
.toteboard td{padding:7px 5px;border-top:1px solid rgba(216,176,74,.2);font-size:15px;text-shadow:0 0 6px rgba(255,200,80,.5)}
.toteboard tr.pick td{background:rgba(63,193,193,.12)}
.toteboard tr{cursor:pointer}
.toteboard .odds{font-size:22px;font-weight:700;text-align:right;transition:color .3s}
.toteboard .odds.flash{color:#fff}
.toteboard .mine{color:#fff1b8}
.toteboard small{color:#b88d3c}
.betbox .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.betbox .label{text-align:center;font-weight:700;color:var(--gold2);letter-spacing:.08em;text-transform:uppercase;font-size:13.5px;margin-top:10px}
.ticket{background:linear-gradient(180deg,#f6ecd0,#e8d8ac);color:#2b1f10;border:2px dashed #8a6a2a;font-family:'Courier New',monospace;padding:12px 14px;max-width:360px;margin:12px auto 0;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.45);transform:rotate(-1.2deg)}
.ticket .h{font-family:Limelight,serif;font-size:18px;color:#7c1d2b}
.ticket b{font-size:20px}
.potential{text-align:center;font-size:15px;margin-top:6px;color:#cfe9dc}
.fieldlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}
.fieldlist .f{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.25);border:1px solid rgba(216,176,74,.35);border-radius:6px;padding:6px}
.fieldlist .f .th{width:64px;height:48px;border-radius:4px;overflow:hidden;flex:none;background:#0d2a1f}
.fieldlist .f .th img,.fieldlist .f .th canvas{width:100%;height:100%;object-fit:cover;display:block}
.fieldlist .f.me{border-color:var(--gold2);box-shadow:0 0 10px rgba(243,214,122,.3)}
.fieldlist .f div{font-size:13.5px;line-height:1.3}
.fieldlist .f b{color:var(--gold2)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <img class="wiz" src="wizard.png" alt="" onerror="this.style.display='none'">
      <img class="logo" src="logo.png" alt="StrideMagic" onerror="this.outerHTML='<span class=&quot;logotext&quot;>StrideMagic</span>'">
    </div>
    <div class="hbtns">
      <button class="btn small ghost" id="btnHow">How to Play</button>
      <button class="btn small ghost" id="btnSpeed">Speed: Normal</button>
      <button class="btn small ghost" id="btnSound">Sound: On</button>

}

/* ================= TRACK GEOMETRY ================= */
const cvs=$('#track'), ctx=cvs.getContext('2d');
let G=null;
function layout(){
  const W=cvs.parentElement.clientWidth||800; const vertical=W<640;
  const H=vertical?Math.round(W*1.55):Math.round(W*0.64);
  const dpr=window.devicePixelRatio||1;
  cvs.width=Math.round(W*dpr); cvs.height=Math.round(H*dpr); cvs.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const VW=vertical?H:W, VH=vertical?W:H;
  let R=Math.min((VW-40)/4.3,(VH-40)/2.7), g;
  for(let k=0;k<6;k++){
    const L=1.6*R, P=2*L+2*Math.PI*R, step=P/FINISH;
    const lane=Math.max(7,Math.min(step*0.9,R*0.125)); const tw=4*lane+10;
    const bR=Math.max(5,Math.min(step*0.36,12)); const edge=tw/2+bR*2+12;
    const spH=lane*(vertical?2.1:2.75), spW=spH*140/84;
    const needW=L+2*R+2*edge, needH=2*R+2*edge+spH*0.45;
    g={W,H,VW,VH,vertical,R,L,P,step,lane,tw,bR,spH,spW,cx:VW/2,cy:VH/2+spH*0.15};
    const sc=Math.min(VW/needW,VH/needH); if(Math.abs(sc-1)<0.01) break; R*=sc;
  }

}
function vPoint(s){
  const {R,L,P,cx,cy}=G; s=((s%P)+P)%P; const h=L/2, PR=Math.PI*R;
  if(s<h) return {x:cx+s,y:cy+R,nx:0,ny:1};
  s-=h; if(s<PR){const th=Math.PI/2-s/R;return {x:cx+h+R*Math.cos(th),y:cy+R*Math.sin(th),nx:Math.cos(th),ny:Math.sin(th)};}
  s-=PR; if(s<L) return {x:cx+h-s,y:cy-R,nx:0,ny:-1};
  s-=L; if(s<PR){const th=-Math.PI/2-s/R;return {x:cx-h+R*Math.cos(th),y:cy+R*Math.sin(th),nx:Math.cos(th),ny:Math.sin(th)};}
  s-=PR; return {x:cx-h+s,y:cy+R,nx:0,ny:1};
}
function T(x,y){ return G.vertical?{x:G.VH-y,y:x}:{x,y}; }
function pt(s,off){ const v=vPoint(s); return T(v.x+v.nx*off, v.y+v.ny*off); }

  x.globalAlpha=1; return c; }

    const n=pts.length; c.strokeStyle='#efe6d2';c.lineWidth=4.4;c.beginPath();c.moveTo(pts[n-4]+(pts[n-2]-pts[n-4])*.55,pts[n-3]+(pts[n-1]-pts[n-3])*.55);c.lineTo(pts[n-2],pts[n-1]);c.stroke();
    c.fillStyle='#1b140e';c.beginPath();c.ellipse(pts[n-2]+1,pts[n-1]+1.5,3.2,2,0,0,7);c.fill(); };

  if(!o.bare){ c.strokeStyle='#5a3a1c';c.lineWidth=2;c.beginPath();c.moveTo(40,50);c.lineTo(104,40);c.stroke(); }
  c.strokeStyle=o.mane;c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(58,33);c.quadraticCurveTo(46,38,48,58);c.stroke();
  c.fillStyle=o.coat; c.beginPath();
  c.moveTo(60,36); c.bezierCurveTo(60,25,72,23,84,26); c.bezierCurveTo(94,27,100,25,104,25);

  c.bezierCurveTo(128,10,133,16,136,23); c.bezierCurveTo(137,26,134,28,131,27); c.bezierCurveTo(127,25,124,22,121,21);
  c.bezierCurveTo(117,26,113,34,111,44); c.bezierCurveTo(109,51,101,52,96,51); c.bezierCurveTo(88,53,76,53,70,51);
  c.bezierCurveTo(61,49,59,43,60,36); c.closePath(); c.fill();

/* ================= PORTRAITS (stand-ins until your pictures are in the folder) ================= */
function decoBG(c,w,h,col){
  const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,shade(col,0.25)); g.addColorStop(1,shade(col,-0.55)); c.fillStyle=g; c.fillRect(0,0,w,h);
  c.save(); c.globalAlpha=.18; c.strokeStyle='#f3d67a'; c.lineWidth=2;
  for(let i=0;i<19;i++){ const a=Math.PI+i*Math.PI/18; c.beginPath(); c.moveTo(w/2,h*0.78); c.lineTo(w/2+Math.cos(a)*w,h*0.78+Math.sin(a)*w); c.stroke(); }
  c.restore(); c.fillStyle='rgba(0,0,0,.25)'; c.fillRect(0,h*0.78,w,h*0.22);
}
function horsePortrait(hid,num){
  const h=ROSTER_H[hid]; const w=480,ht=360; const cv=document.createElement('canvas'); cv.width=w; cv.height=ht; const c=cv.getContext('2d');

  c.fillStyle='rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(82,80,40,4,0,0,7); c.fill();

}

  // cap (1920s driving cap in silks)

  c.fillStyle=d.trim; c.beginPath(); c.arc(cx,h-274,5,0,7); c.fill();

  if(L.glasses){ c.strokeStyle='#1b140e'; c.lineWidth=2.5; c.beginPath(); c.arc(cx-18,h-208,11,0,7); c.moveTo(cx+29,h-208); c.arc(cx+18,h-208,11,0,7); c.moveTo(cx-7,h-208); c.lineTo(cx+7,h-208); c.stroke(); }
  c.strokeStyle='#b07850'; c.lineWidth=3; c.beginPath(); c.moveTo(cx,h-200); c.lineTo(cx-5,h-184); c.lineTo(cx+3,h-182); c.stroke();
  if(L.mustache){ c.fillStyle=L.grey?'#cfcac0':'#3a2216'; c.beginPath(); c.ellipse(cx-12,h-172,14,5,0.2,0,7); c.ellipse(cx+12,h-172,14,5,-0.2,0,7); c.fill(); }
  c.strokeStyle='#7c2a20'; c.lineWidth=3; c.beginPath(); c.arc(cx,h-170,14,0.2*Math.PI,0.8*Math.PI); c.stroke();

}

/* ================= RACE CARD & ODDS ================= */
function makeCard(mode){
  const dk=todayKey(); const seed= mode==='daily' ? hashStr('stridemagic-card-'+dk) : (Math.random()*4294967296)>>>0;
  const rng=mulberry32(seed);
  const hs=shuffle([0,1,2,3,4,5],rng).slice(0,4), ds=shuffle([0,1,2,3,4,5],rng).slice(0,4);
  const form=hs.map(()=> (rng()-0.5)*1.2);
  return {seed,mode,dk,hs,ds,form,name:pick(RACE_NAMES,rng),purse:pick([2500,3000,4000,5000,7500,10000],rng),cond:pick(COND,rng),weather:pick(WEATHER,rng),raceNo:1+Math.floor(rng()*9)};
}
const STD_ODDS=[[1,5],[2,5],[1,2],[3,5],[4,5],[1,1],[6,5],[7,5],[3,2],[8,5],[9,5],[2,1],[5,2],[3,1],[7,2],[4,1],[9,2],[5,1],[6,1],[7,1],[8,1],[10,1],[12,1],[15,1],[20,1],[30,1]];
function toOdds(p){ const x=Math.max(0.2,0.85/p-1); let best=STD_ODDS[0]; for(const o of STD_ODDS) if(Math.abs(o[0]/o[1]-x)<Math.abs(best[0]/best[1]-x)) best=o; return best; }
const oddsTxt = o => `${o[0]}-${o[1]}`;
const oddsVal = o => o[0]/o[1];
function ratingH(h){ return h.spd*1.05+h.sta*0.8+h.kick*0.9+h.gait*0.65; }
function ratingD(d){ return d.rail*0.5+d.savvy*0.6+d.nerve*0.45; }
function probs(ratings){ const e=ratings.map(r=>Math.exp(r*0.55)); const s=e.reduce((a,b)=>a+b,0); return e.map(v=>v/s); }
function morningLine(){ const c=S.card; return probs(c.hs.map((hid,i)=>ratingH(ROSTER_H[hid])+c.form[i])).map(toOdds); }
function pairings(){ // horse index on card -> driver id
  const c=S.card, myIdx=c.hs.indexOf(S.pre.hid); const rest=c.ds.filter(d=>d!==S.pre.did); const out=[];
  c.hs.forEach((hid,i)=>{ out[i]= i===myIdx ? S.pre.did : rest.shift(); }); return out; }
function liveProbs(){ const c=S.card, pr=pairings(); return probs(c.hs.map((hid,i)=>ratingH(ROSTER_H[hid])+ratingD(ROSTER_D[pr[i]])+c.form[i]+(S.toteNoise?S.toteNoise[i]:0))); }

function cubeHTML(v,rolling){ const [fx,fy]=FACE_ROT[v]; let sx=fx, sy=fy;
  if(rolling){ const r=()=>(Math.random()<.5?-1:1)*(540+90*Math.floor(Math.random()*4)); sx=fx+r(); sy=fy+r(); }
  return `<div class="cube" style="--fx:${fx}deg;--fy:${fy}deg;--sx:${sx}deg;--sy:${sy}deg">${[1,2,3,4,5,6].map(n=>`<div class="face f${n}">${pipsHTML(n)}</div>`).join('')}</div>`; }
const rollWait=()=>new Promise(r=>setTimeout(r,880));
function pipsHTML(v){ const map={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}; let s=''; for(let i=0;i<9;i++) s+=map[v].includes(i)?'<i class="pip"></i>':'<i></i>'; return s; }
function cardHTML(key,curse,big,extra){ const c=curse?CURSE[key]:BONUS[key];
  return `<div class="card ${curse?'curse':''} ${big?'bigcard':''}"><div class="ic">${c.ic}</div><div class="t">${esc(c.t)}</div><div class="d">${esc(c.d)}</div>${extra||''}</div>`; }
function rivalsAhead(h){ return S.horses.filter(o=>o!==h&&!o.finished&&o.pos>h.pos); }
function canPlay(key){
  const p=me(); if(!p||S.busy||!['roll','assign','push'].includes(S.phase)) return false;
  switch(key){
    case 'clear': return S.phase!=='assign';
    case 'sugar': return p.stamina<maxSta(p);
    case 'footing': return S.phase==='assign';
    case 'tip': return true;
    case 'shoe': return false;
    case 'cut': return rivalsAhead(p).length>0;
  }
  return false;
}

}

function startTote(){

      <b>$${t.amt} ${t.type.toUpperCase()}</b><br>#${t.on+1} ${esc(ROSTER_H[c.hs[t.on]].name.toUpperCase())}<br>ODDS AT POST ${oddsTxt(t.odds)}<hr style="border:0;border-top:1px dashed #8a6a2a">TICKET No. ${t.no}</div>`,

/* ================= RACE SETUP ================= */
function shuffleDeck(counts,rng){ const d=[]; Object.entries(counts).forEach(([k,n])=>{for(let i=0;i<n;i++)d.push(k);}); return shuffle(d,rng); }
function drawBonus(){ if(!S.bdeck.length) S.bdeck=shuffleDeck(BONUS_DECK,S.drng); return S.bdeck.pop(); }
function drawCurse(){ if(!S.cdeck.length) S.cdeck=shuffleDeck(CURSE_DECK,S.drng); return S.cdeck.pop(); }
function buildField(){
  const c=S.card, pr=pairings();
  S.horses=c.hs.map((hid,i)=>{ const h=ROSTER_H[hid], d=ROSTER_D[pr[i]]; const isMe=hid===S.pre.hid;
    return {num:i+1, hid, did:pr[i], horse:h.name, driver:d.name, driverShort:d.short, silk:d.silk, trim:d.trim, text:d.text, coat:h.coat, mane:h.mane, blaze:h.blaze,
      spd:h.spd, sta:h.sta, kick:h.kick, gait:h.gait, rail:d.rail, savvy:d.savvy, nerve:d.nerve, style:isMe?'player':d.style, isMe,
      pos:0, stamina:(h.sta-1)*2, hand:[], skip:0, thrown:false, finished:false, finishRound:0, finishStamina:0, tie:0,
      saves:Math.max(0,h.gait-3), rerolls:Math.max(0,d.nerve-3)}; });
}
function startRace(){
  S.raceId++; const c=S.card; S.mode=c.mode; S.dateKey=c.dk;
  const seed=c.seed^hashStr(String(S.pre.hid)+'-'+String(S.pre.did));
  S.pd=new DiceStream(seed^0xA1B2C3, ()=>{ if(S.tipLeft>0) S.tipLeft--; });
  S.rd=new DiceStream(seed^0x5EED42);
  S.drng=mulberry32(seed^0xC0FFEE); S.airng=mulberry32(seed^0xD15EA5);
  S.bdeck=shuffleDeck(BONUS_DECK,S.drng); S.cdeck=shuffleDeck(CURSE_DECK,S.drng);
  buildField();
  S.horses.forEach(h=>{ for(let i=0;i<Math.max(0,h.savvy-3);i++){ const k=drawBonus(); if(h.isMe) h.hand.push(k); else { if(h.hand.length>=RIVAL_HAND) h.hand.shift(); h.hand.push(k); } } });
  S.round=1; S.log=[]; S.tipLeft=0; S.mover=null; S.busy=false; S.pushDie=null; S.dice=[]; S.held=false;
  S.leader=-1; S.calledHalf=false; S.calledStretch=false; S.winnerCalled=false; S.lastLeadCall=0;
  buildSprites();
  $('#raceTitle').textContent=`Race ${c.raceNo} · ${c.name}`;
  { const rid=S.raceId; if(S.voice){ announce('post',true); setTimeout(()=>{ if(rid!==S.raceId) return; sfx.bugle(); setTimeout(()=>{ if(rid===S.raceId) announce('off',true); },1500); },2900); } else sfx.bugle(); }
  const p=me(); const t=S.ticket;
  say(`<b>Post time!</b> ${esc(c.name)}, one mile on a ${c.cond.toLowerCase()} track. ${t?`You hold $${t.amt} to ${t.type} on #${t.on+1} ${esc(S.horses[t.on].horse)} at ${oddsTxt(t.odds)}.`:'No bet this race.'}`);
  if(p.hand.length) say(`Your driver's savvy pays off: you start with ${p.hand.map(k=>BONUS[k].t).join(' and ')}.`);
  say(`The starter's car pulls away… <b>and they're off!</b>`);
  startPlayerTurn();
}

/* ================= MOVEMENT ================= */
async function moveBy(h,n){
  if(!n) return;
  S.mover=h;
  if(n<0){ const target=Math.max(0,h.pos+n); while(h.pos>target){ h.pos--; S.anim^=1; sfx.hoof(); draw(); await sleep(95);} S.mover=null; draw(); checkCalls(); return; }
  let dir=1, bounced=false;
  for(let i=0;i<n;i++){ if(h.pos>=FINISH){dir=-1;bounced=true;} h.pos+=dir; S.anim^=1; sfx.hoof(); render(); await sleep(h.isMe?125:100); }
  S.mover=null; draw(); checkCalls();
  if(bounced) say(`${h.isMe?'You overshoot':esc(nameOf(h))+' overshoots'} the wire and bounce${h.isMe?'':'s'} back to space ${h.pos}. Need it exact!`);
}

/* ================= LANDING ================= */
async function resolveLanding(h){
  if(h.pos===FINISH){
    h.finished=true; h.finishRound=S.round; h.finishStamina=h.stamina; h.tie=S.drng();
    say(h.isMe?`<b>You hit the wire!</b> ${esc(h.horse)} crosses the finish line!`:`<b>${esc(h.driverShort)}</b> brings ${esc(h.horse)} across the finish line!`);
    if(h.isMe) sfx.kick();
    render(); return;
  }
  const t=SPECIAL[h.pos];
  if(t==='bonus'){ const k=drawBonus(); if(h.isMe) await playerGetsCard(k); else rivalGetsCard(h,k); }
  else if(t==='curse'){ const k=drawCurse(); await applyCurse(h,k); }
  else if(t==='lane'){ await laneCall(h); }
  else if(t==='pole'&&h.isMe){ say(`You pass the ${['quarter','half','three-quarter'][CHECKPOINTS.indexOf(h.pos)]} pole.`); }
  render();
}
async function playerGetsCard(k){
  const p=me(); sfx.card();
  if(p.hand.length<HAND_MAX){
    await showModal({title:'Bonus Card!',html:cardHTML(k,false,true),buttons:[{label:'Into My Hand',value:1,cls:'green'}]});
    p.hand.push(k); say(`You draw <b>${BONUS[k].t}</b>.`);
  } else {
    const v=await showModal({title:'Your Hand Is Full',html:cardHTML(k,false,true)+`<p style="text-align:center">You can hold 3 cards. Toss one to keep this card, or pass on it.</p>`,
      buttons:[...p.hand.map((c,i)=>({label:'Toss '+BONUS[c].t,value:i,cls:'small'})),{label:'Pass on it',value:-1,cls:'small ghost'}]});
    if(v>=0){ const old=p.hand.splice(v,1)[0]; p.hand.push(k); say(`You toss ${BONUS[old].t} and keep <b>${BONUS[k].t}</b>.`); }
    else say(`You pass on ${BONUS[k].t}.`);
  }
  render();
}
function rivalGetsCard(h,k){ if(h.hand.length>=RIVAL_HAND) h.hand.shift(); h.hand.push(k); say(`${esc(h.driverShort)} picks up a bonus card.`); }
async function applyCurse(h,k){
  const isP=h.isMe; const c=CURSE[k];
  const si=h.hand.indexOf('shoe');
  if(si>=0){
    h.hand.splice(si,1);
    if(isP){ sfx.card(); await showModal({title:'Lucky Horseshoe!',html:cardHTML(k,true,true)+`<p style="text-align:center">Your horseshoe blocks the bad luck. No harm done.</p>`,buttons:[{label:'Whew!',value:1,cls:'green'}]}); }
    say(`${isP?'Your':esc(h.driverShort)+"'s"} Lucky Horseshoe blocks <b>${c.t}</b>!`); render(); return;
  }
  if(isP){ sfx.bad(); announce(k==='boxed'?'boxed':'badluck'); await showModal({title:'Bad Luck!',html:cardHTML(k,true,true),buttons:[{label:'Ouch. OK',value:1,cls:'red'}]}); }
  const who=isP?'You':esc(h.driverShort);
  switch(k){
    case 'boxed': h.skip+=1; say(`<b>${c.t}:</b> ${who} ${isP?'lose':'loses'} the next turn.`); break;
    case 'thrown': h.thrown=true; say(`<b>${c.t}:</b> ${who} will stride at half speed next roll.`); break;
    case 'mud': h.stamina=Math.max(0,h.stamina-4); say(`<b>${c.t}:</b> ${who} ${isP?'lose':'loses'} 4 stamina.`); break;
    case 'inquiry': say(`<b>${c.t}:</b> ${who} ${isP?'are':'is'} set back 3.`); await moveBy(h,-3); break;
    case 'pole': { const cp=[0,...CHECKPOINTS].filter(x=>x<h.pos).pop()||0; say(`<b>${c.t}:</b> ${who} ${isP?'go':'goes'} back to space ${cp}.`); await moveBy(h,cp-h.pos); break; }
  }
  render();
}
async function laneCall(h){
  const isP=h.isMe;
  const traffic=S.horses.some(o=>o!==h&&!o.finished&&o.pos>h.pos&&o.pos<=h.pos+3);
  const risk=railRisk(h,traffic), gain=railGain(h);
  const riskTxt=risk===1?'A <b>1</b>':`A <b>1${risk>2?' to '+risk:' or 2'}</b>`;
  let choice;
  if(isP){
    choice=await showModal({title:'Lane Call',html:`<p style="text-align:center">You're heading into the turn.${traffic?' <b style="color:#ffb3b3">Traffic ahead on the rail!</b>':' The rail looks clear.'}</p>
      <p><b style="color:var(--gold2)">Hug the Rail:</b> +${gain} spaces, but roll a die. ${riskTxt} means you're boxed in and lose your next turn. <i>(Your driver's Rail skill: ${h.rail}★)</i></p>
      <p><b style="color:var(--teal)">Swing Wide:</b> +1 space, no risk.</p>${S.tipLeft>0?`<p style="text-align:center;color:var(--gold2)">Hot Tip says your next die is <b>${S.pd.peek(1)[0]}</b>.</p>`:''}`,
      buttons:[{label:'Hug the Rail',value:'rail'},{label:'Swing Wide',value:'wide',cls:'teal'}]});
  } else {
    choice = h.style==='reckless'?'rail': h.style==='cautious'?(risk===1?'rail':'wide'): h.style==='dirty'?'rail':(risk<=1?'rail':'wide');
  }
  if(choice==='rail'){
    const v=(isP?S.pd:S.rd).next(); sfx.dice();
    if(v<=risk){ h.skip+=1; if(isP) announce('boxed'); say(`${isP?'You hug':esc(h.driverShort)+' hugs'} the rail, rolls a ${v}… <b>boxed in!</b> ${isP?'You lose':'Loses'} the next turn.`); render(); return; }
    say(`${isP?'You hug':esc(h.driverShort)+' hugs'} the rail (rolled ${v}) and ${isP?'save':'saves'} ground: +${gain}!`);
    await moveBy(h,gain); await resolveLanding(h);
  } else {
    say(`${isP?'You swing':esc(h.driverShort)+' swings'} wide around the turn: +1.`);
    await moveBy(h,1); await resolveLanding(h);
  }
}

/* ================= PLAYER TURN ================= */
async function startPlayerTurn(){
  const p=me(); const rid=S.raceId;
  S.dice=[]; S.stride=S.stam=null; S.kickUsed=false; S.pushDie=null; S.bust=false; S.held=false; S.turnStart=p.pos;
  if(p.finished){ await endPlayerTurn(); return; }
  if(p.skip>0){ p.skip--; S.phase='idle'; say(`You're boxed in and sit out round ${S.round}.`); render(); await sleep(1200); if(rid!==S.raceId) return; await endPlayerTurn(); return; }
  S.phase='roll'; say(`<b>Round ${S.round}.</b> Your drive. ${FINISH-p.pos} spaces to the wire.`); render();
}
async function doRoll(){
  if(S.phase!=='roll'||S.busy) return;
  S.busy=true; S.dice=[S.pd.next(),S.pd.next(),S.pd.next()]; S.stride=S.stam=null; S.phase='assign'; S.rolling=true; sfx.dice(); render();
  await rollWait(); S.rolling=false; S.busy=false; render();
}
async function doSteady(){
  const p=me(); if(S.phase!=='assign'||S.busy||p.rerolls<=0) return;
  p.rerolls--; S.busy=true; S.dice=[S.pd.next(),S.pd.next(),S.pd.next()]; S.stride=S.stam=null; S.rolling=true; sfx.dice();
  say(`<b>Steady Hands.</b> You settle the horse and reroll.`); render(); await rollWait(); S.rolling=false; S.busy=false; render();
}
function pickDie(i){
  if(S.phase!=='assign'||S.busy) return;
  if(S.stride===i){ S.stride=null; }
  else if(S.stam===i){ S.stam=null; }
  else if(S.stride==null) S.stride=i;
  else if(S.stam==null) S.stam=i;
  else { S.stride=i; S.stam=null; }
  render();
}
async function doGo(){
  if(S.phase!=='assign'||S.stride==null||S.stam==null||S.busy) return;
  const p=me(); S.busy=true;
  const raw=S.dice[S.stride]; const tv=S.dice[S.stam];
  let sv=raw; const bonus=spdBonus(p,raw);
  p.stamina=Math.min(maxSta(p),p.stamina+tv);
  if(p.thrown){ sv=Math.ceil(sv/2); p.thrown=false; say(`Thrown shoe slows you: Stride counts as ${sv}.`); }
  sv+=bonus;
  S.turnStart=p.pos; S.phase='moving'; render();
  say(`You stride <b>${sv}</b>${bonus?' (speed +1)':''} and bank <b>${tv}</b> stamina.`);
  await moveBy(p,sv); await resolveLanding(p);
  S.busy=false; S.dice=[];
  if(p.finished){ await endPlayerTurn(); return; }
  S.phase='push'; render();
}
async function doPush(){
  if(S.phase!=='push'||S.busy) return;
  const p=me(); S.busy=true; S.phase='moving';
  const v=S.pd.next(); S.pushDie=v; S.bust=v===1; S.held=false; S.rolling=true; sfx.dice(); render(); await rollWait(); S.rolling=false; render();
  if(v===1){
    if(p.saves>0){ p.saves--; S.held=true; render(); announce('held',true); say(`<b>A 1!</b> ${esc(p.horse)} wobbles, but that steady gait <b>holds the trot</b>. You keep your ground and settle in.`);
      S.busy=false; await endPlayerTurn(); return; }
    sfx.bust(); announce('broke',true); const target=Math.min(p.pos,S.turnStart);
    say(`<b>A 1!</b> ${esc(p.horse)} breaks stride and you drop back to space ${target}.`);
    await sleep(400); await moveBy(p,target-p.pos);
    S.busy=false; await endPlayerTurn(); return;
  }
  say(`You push on: <b>${v}</b> more.`);
  await moveBy(p,v); await resolveLanding(p);
  S.busy=false;
  if(p.finished){ await endPlayerTurn(); return; }
  S.phase='push'; render();
}
async function doKick(){
  const p=me(); const cost=kickCost(p); if(S.phase!=='push'||S.busy||S.kickUsed||p.stamina<cost) return;
  S.busy=true; S.phase='moving'; S.kickUsed=true; p.stamina-=cost; const amt=kickAmt(p);
  sfx.kick(); announce('kick'); say(amt===FINISH-p.pos&&p.pos>=STRETCH?`You go to the whip! <b>Finishing kick straight to the wire!</b>`:`You go to the whip! <b>Closing kick: +${amt}.</b>`);
  await moveBy(p,amt); await resolveLanding(p);
  S.busy=false;
  if(p.finished){ await endPlayerTurn(); return; }
  S.phase='push'; render();
}
async function doPull(){ if(S.phase!=='push'||S.busy) return; say(`You pull up and settle in at space ${me().pos}.`); await endPlayerTurn(); }
async function playCard(i){
  const p=me(); const k=p.hand[i]; if(!k||!canPlay(k)) return;
  S.busy=true; p.hand.splice(i,1); sfx.card();
  const prev=S.phase;
  switch(k){
    case 'clear': S.phase='moving'; render(); say(`<b>Clear Lane!</b> You find daylight: +3.`); await moveBy(p,3); await resolveLanding(p); S.phase=prev; break;
    case 'sugar': p.stamina=Math.min(maxSta(p),p.stamina+6); say(`<b>Sugar Cube!</b> +6 stamina.`); break;
    case 'footing': S.dice=[S.pd.next(),S.pd.next(),S.pd.next()]; S.stride=S.stam=null; S.rolling=true; sfx.dice(); say(`<b>Good Footing!</b> You reroll the dice.`); render(); await rollWait(); S.rolling=false; break;
    case 'tip': S.tipLeft=3; say(`<b>Hot Tip!</b> A fellow at the rail whispers your next three dice.`); break;
    case 'cut': { const t=rivalsAhead(p).sort((a,b)=>a.pos-b.pos)[0]; say(`<b>Cut Him Off!</b> You slide in front of ${esc(t.driverShort)}, who drops back 3.`); await moveBy(t,-3); break; }
  }
  S.busy=false;
  if(p.finished){ await endPlayerTurn(); return; }
  render();
}

/* ================= RIVALS ================= */
async function endPlayerTurn(){
  const rid=S.raceId;
  S.phase='idle'; S.dice=[]; S.stride=S.stam=null; S.pushDie=null; render();
  await sleep(400);
  for(const h of S.horses){
    if(rid!==S.raceId) return;
    if(h.isMe||h.finished) continue;
    await rivalTurn(h); render(); await sleep(320);
  }
  if(rid!==S.raceId) return;
  if(!S.winnerCalled&&S.horses.some(h=>h.finished)){ S.winnerCalled=true; const w=standingOrder()[0];
    if(S.horses.filter(h=>h.finished&&h.finishRound===w.finishRound).length>1) announce('photo',true); announce('win'+w.hid,true); }
  const p=me(); const done=S.horses.filter(h=>!h.isMe&&h.finished).length;
  if(p.finished||done>=3){ await finishRace(); return; }
  S.round++; startPlayerTurn();
}
async function rivalTurn(h){
  const rnd=S.airng;
  if(h.skip>0){ h.skip--; say(`${esc(h.driverShort)} is boxed in and sits this one out.`); return; }
  for(const k of [...h.hand]){
    if(h.finished) return;
    const dist=FINISH-h.pos;
    if(k==='sugar'&&h.stamina<=maxSta(h)-7){ h.hand.splice(h.hand.indexOf(k),1); h.stamina=Math.min(maxSta(h),h.stamina+6); say(`${esc(h.driverShort)} feeds ${esc(h.horse)} a Sugar Cube.`); }
    else if(k==='clear'&&dist>=3){ h.hand.splice(h.hand.indexOf(k),1); say(`${esc(h.driverShort)} plays <b>Clear Lane</b>: +3.`); await moveBy(h,3); await resolveLanding(h); }
    else if(k==='cut'){
      const ahead=rivalsAhead(h); if(!ahead.length) continue;
      const mine=me(); let t = h.style==='dirty'&&ahead.includes(mine) ? mine : ahead.sort((a,b)=>a.pos-b.pos)[0];
      h.hand.splice(h.hand.indexOf(k),1);
      say(`${esc(h.driverShort)} <b>cuts off</b> ${t.isMe?'<b>you</b>':esc(t.driverShort)}! ${t.isMe?'You drop':'Drops'} back 3.`);
      if(t.isMe) sfx.bad(); await moveBy(t,-3);
    }
    else if(k==='tip'){ h.hand.splice(h.hand.indexOf(k),1); say(`${esc(h.driverShort)} studies a tip sheet and tosses it.`); }
  }
  if(h.finished) return;
  let d=[S.rd.next(),S.rd.next(),S.rd.next()];
  const dist0=FINISH-h.pos;
  const eff=v=>(h.thrown?Math.ceil(v/2):v)+spdBonus(h,v);
  if(Math.max(...d)<=3&&dist0>6){
    if(h.hand.includes('footing')){ h.hand.splice(h.hand.indexOf('footing'),1); d=[S.rd.next(),S.rd.next(),S.rd.next()]; say(`${esc(h.driverShort)} plays Good Footing and rerolls.`); }
    else if(h.rerolls>0){ h.rerolls--; d=[S.rd.next(),S.rd.next(),S.rd.next()]; say(`${esc(h.driverShort)} steadies the horse and rerolls.`); }
  }
  const dist=FINISH-h.pos;
  const byEff=d.map((v,i)=>[eff(v),i]).sort((a,b)=>b[0]-a[0]);
  let si;
  const exact=byEff.find(([v])=>v===dist);
  if(exact) si=exact[1];
  else if(dist<=7){ const ok=byEff.filter(([v])=>v<dist); si=ok.length?ok[0][1]:byEff[2][1]; }
  else if(h.style==='cautious'&&h.pos<FINISH*0.6) si=byEff[1][1];
  else si=byEff[0][1];
  const rest=d.filter((_,i)=>i!==si); const tv=Math.max(...rest);
  const sv=eff(d[si]); h.thrown=false;
  h.stamina=Math.min(maxSta(h),h.stamina+tv);
  const start=h.pos;
  say(`${esc(h.driverShort)} rolls ${d.join('-')}, ${esc(h.horse)} strides <b>${sv}</b>.`);
  await moveBy(h,sv); await resolveLanding(h);
  if(h.finished) return;
  { const amt=kickAmt(h), cost=kickCost(h); const dd=FINISH-h.pos;
    if(h.stamina>=cost&&(dd===amt||(dd>amt&&(h.style==='reckless'||h.pos>=STRETCH-8)))){
      h.stamina-=cost; say(`${esc(h.driverShort)} goes to the whip: <b>kick +${amt}</b>!`); await moveBy(h,amt); await resolveLanding(h); if(h.finished) return; } }
  let pushes=0;
  while(!h.finished&&h.skip===0){
    const gain=h.pos-start, dd=FINISH-h.pos; let go=false;
    const safe=h.saves>0;
    if(dd<=6) go=false;
    else if(h.style==='reckless') go=gain<7||(gain<9&&rnd()<0.25);
    else if(h.style==='cautious') go=(me().pos-h.pos>=6)&&gain<5;
    else if(h.style==='dirty') go=pushes<1&&gain<6;
    else go=(gain<5)||(safe&&gain<8);
    if(!go) break;
    pushes++;
    const v=S.rd.next();
    if(v===1){
      if(h.saves>0){ h.saves--; say(`${esc(h.driverShort)} pushes… a 1! But ${esc(h.horse)} holds the trot.`); return; }
      const target=Math.min(h.pos,start); say(`${esc(h.driverShort)} pushes… rolls a 1! ${esc(h.horse)} <b>breaks stride</b>.`); await moveBy(h,target-h.pos); return; }
    say(`${esc(h.driverShort)} pushes on: ${v}.`); await moveBy(h,v); await resolveLanding(h);
  }
}

/* ================= FINISH ================= */
async function finishRace(){
  S.phase='done'; render();
  const hs=standingOrder();
  const p=me(); const place=hs.indexOf(p);
  const first=hs[0];
  const same=hs.filter(h=>h.finished&&h.finishRound===first.finishRound);
  if(same.length>1){
    sfx.card();
    await showModal({title:'Photo Finish!',html:`<div class="photo"><div style="font-size:13px;letter-spacing:.2em">STRIDEMAGIC DOWNS · OFFICIAL PHOTO</div>
      ${same.map((h,i)=>`<div class="lane"><span class="num" style="background:${h.silk};color:${h.text};border-color:${h.trim}">${h.num}</span><b>${ordinal(hs.indexOf(h))}</b> ${esc(h.horse)} · ${h.finishStamina} stamina left${i===0?' · <i>by a nose!</i>':''}</div>`).join('')}
      </div><p style="text-align:center;font-size:15px">Same round across the wire, so the camera decides. The horse with more stamina left gets its nose down first.</p>`,
      buttons:[{label:'See the Results',value:1}]});
  }
  const t=S.ticket; let payout=0, betLine='No bet this race.';
  if(t){
    const fin=hs.findIndex(h=>h.num===t.on+1);
    const hit=(t.type==='win'&&fin===0)||(t.type==='place'&&fin<=1)||(t.type==='show'&&fin<=2);
    if(hit){ payout=payoutFor(t.type,t.amt,t.odds); betLine=`Your $${t.amt} to ${t.type} on #${t.on+1} at ${oddsTxt(t.odds)} pays <b>$${payout}</b>!`; }
    else betLine=`Your $${t.amt} to ${t.type} ticket on #${t.on+1} is torn up.`;
  }
  S.bank+=payout; store('bank',S.bank);
  const stats=load('stats',{races:0,wins:0}); stats.races++; if(place===0) stats.wins++; store('stats',stats);
  let bestLine='';
  if(S.mode==='daily'){
    const key='daily_'+S.dateKey; const old=load(key,null); const turns=p.finished?p.finishRound:S.round;
    const isBetter=!old||place<old.place||(place===old.place&&turns<old.turns);
    if(isBetter){ store(key,{place,turns}); bestLine=old?`<b>New personal best for today!</b>`:`Today's mark is set: ${ordinal(place)} in ${turns} turns.`; }
    else bestLine=`Today's best still stands: ${ordinal(old.place)} in ${old.turns} turns.`;
  }
  place===0?sfx.win():sfx.lose();
  if(t) announce(payout>0?'cash':'lose',true); else if(place>0) announce('lose',true);
  const headline=['You Win!','Second Place','Third Place','Fourth Place'][place];
  say(place===0?`<b>${esc(p.horse)} wins it!</b> What a drive!`:`You finish ${ordinal(place)}.`);
  render();
  await showModal({title:headline,html:`
    <table class="res">${hs.map((h,i)=>`<tr class="${h.isMe?'me':''}"><td>${ordinal(i)}</td><td><span class="num" style="background:${h.silk};color:${h.text};border-color:${h.trim}">${h.num}</span></td><td>${esc(h.horse)}<br><small>${h.isMe?'You':esc(h.driverShort)}</small></td><td style="text-align:right">${h.finished?`Round ${h.finishRound}`:`${FINISH-h.pos} back`}</td></tr>`).join('')}</table>
    <p style="text-align:center">${betLine}</p>
    <div class="tote">BANKROLL <b>$${S.bank}</b></div>
    ${bestLine?`<p style="text-align:center">${bestLine}</p>`:''}`,
    buttons:[{label:'Back to the Program',value:1,cls:'green'}]});
  backToProgram();
}

let vCur=null; const vQ=[];
function announce(key,force){
  if(!S.voice||!VOICE[key]) return;
  if(vCur){ if(force&&vQ.length<4&&!vQ.includes(key)) vQ.push(key); return; }
  const a=new Audio('data:audio/mpeg;base64,'+VOICE[key]); vCur=a; a.volume=1;
  const done=()=>{ if(vCur!==a) return; vCur=null; const n=vQ.shift(); if(n) announce(n,true); };
  a.onended=done; a.onerror=done;
  const pr=a.play(); if(pr&&pr.then) pr.then(()=>{ S.voiceStarted=true; }).catch(()=>{ if(vCur===a){ vCur=null; vQ.length=0; } });
}
function stopVoice(){ vQ.length=0; if(vCur){ try{vCur.pause();}catch(e){} vCur=null; } }
function checkCalls(){
  if(!['roll','assign','push','moving','idle'].includes(S.phase)) return;
  const top=Math.max(...S.horses.map(h=>h.pos)); const leaders=S.horses.filter(h=>h.pos===top&&!h.finished);
  if(!S.calledStretch&&top>=STRETCH){ S.calledStretch=true; announce('stretch',true); return; }
  if(!S.calledHalf&&top>=30){ S.calledHalf=true; announce('half'); return; }
  const now=Date.now();
  if(leaders.length===1&&top>=6&&top<FINISH&&S.leader!==leaders[0].hid&&now-S.lastLeadCall>5000){
    S.leader=leaders[0].hid; S.lastLeadCall=now; announce('lead'+S.leader); }
}

/* ================= EVENTS ================= */
$('#actions').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
  ({roll:doRoll,go:doGo,reset:()=>{S.stride=S.stam=null;render();},steady:doSteady,push:doPush,kick:doKick,pull:doPull,menu:backToProgram})[b.dataset.a](); });
$('#dice').addEventListener('click',e=>{ const d=e.target.closest('.die[data-i]'); if(d) pickDie(+d.dataset.i); });
$('#hand').addEventListener('click',e=>{ const c=e.target.closest('[data-c]'); if(c&&!c.disabled) playCard(+c.dataset.c); });
$('#btnHow').onclick=()=>showModal({title:'How to Play',html:howToHTML(),buttons:[{label:'Got it',value:1}]});
function speedLabel(){ $('#btnSpeed').textContent='Speed: '+(S.speed<1?'Fast':'Normal'); }
function soundLabel(){ $('#btnSound').textContent='Sound: '+(S.muted?'Off':'On'); }
function voiceLabel(){ $('#btnVoice').textContent='Announcer: '+(S.voice?'On':'Off'); }
$('#btnSpeed').onclick=()=>{ S.speed=S.speed<1?1:0.45; store('speed',S.speed); speedLabel(); };
$('#btnSound').onclick=()=>{ S.muted=!S.muted; store('muted',S.muted); soundLabel(); };
$('#btnVoice').onclick=()=>{ S.voice=!S.voice; store('voice',S.voice); voiceLabel(); if(!S.voice) stopVoice(); };
$('#btnMenu').onclick=async()=>{
  if(S.phase==='pre'){ openPre('program'); return; }
  if(S.busy||!['roll','assign','push','done'].includes(S.phase)) return;
  if(S.phase!=='done'){
    const v=await showModal({title:'Leave the Race?',html:`<p style="text-align:center">If you go back to the program now, this race is scratched${S.ticket?` and your $${S.ticket.amt} ticket is lost`:''}.</p>`,
      buttons:[{label:'Keep Racing',value:0,cls:'green'},{label:'Leave',value:1,cls:'red'}]});
    if(!v) return; S.raceId++;
  }
  backToProgram();
};
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden||!$('#pre').hidden) return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(S.phase==='roll') doRoll(); else if(S.phase==='assign') doGo(); else if(S.phase==='push') doPull(); }
  if(S.phase==='assign'&&['1','2','3'].includes(e.key)) pickDie(+e.key-1);
  if(S.phase==='push'&&(e.key==='p'||e.key==='P')) doPush();
  if(S.phase==='push'&&(e.key==='k'||e.key==='K')) doKick();
});
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ layout(); draw(); },80); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>draw());

/* ================= BOOT ================= */
S.card=makeCard('daily');
S.pre.hid=S.card.hs[0]; S.pre.did=S.card.ds[0];
buildField(); S.horses.forEach(h=>{h.isMe=false;});
speedLabel(); soundLabel(); voiceLabel(); layout(); draw();
say('Welcome to <b>StrideMagic Downs</b>! Read the program, pick your horse and driver, and place your bets.');
openPre('program');
document.addEventListener('pointerdown',()=>{ if(!S.voiceStarted&&!$('#pre').hidden) announce('welcome',true); },{once:true});
announce('welcome',true);
})();
</script>
