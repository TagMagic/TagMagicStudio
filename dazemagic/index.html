<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Segoe UI, Arial, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  body.idle { cursor: none; }
  #panel {
    position: fixed; top: 14px; left: 14px; width: 270px;
    background: rgba(10,10,14,0.78); color: #eee; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; padding: 14px; font-size: 13px; transition: opacity .6s;
    backdrop-filter: blur(6px); max-height: calc(100vh - 28px); overflow-y: auto;
  }
  body.idle #panel, body.hidden #panel { opacity: 0; pointer-events: none; }
  #panelHead { display: flex; align-items: center; gap: 6px; margin: -4px 0 10px; }
  #panelWizard { width: 64px; height: 64px; flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); }
  #panelLogo { display: block; flex: 1; min-width: 0; width: 100%; }
  #splash {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(70vw, 900px); pointer-events: none; transition: opacity 2s;
    filter: drop-shadow(0 6px 24px rgba(0,0,0,0.8));
  }
  #splash.gone { opacity: 0; }

  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  button {
    flex: 1 1 45%; background: #2a2a36; color: #fff; border: 1px solid #555; border-radius: 6px;
    padding: 7px 6px; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #3c3c4c; }
  button.on { background: #8a2be2; border-color: #b58cff; }
  label { display: block; margin: 6px 0 2px; color: #bbb; }
  input[type=range], select { width: 100%; }
  select { background: #2a2a36; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 4px; }
  audio { width: 100%; margin-top: 6px; display: none; }
  #status { color: #9fd; margin: 4px 0 8px; min-height: 16px; }
  .hint { color: #888; font-size: 11px; margin-top: 10px; line-height: 1.5; }
  #meter { height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  #meterFill { height: 100%; width: 0; background: linear-gradient(90deg,#f0a,#fa0); }
  #beat { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #333; margin-left: 6px; vertical-align: middle; }
  #credit { border-top: 1px solid rgba(255,255,255,0.12); margin-top: 10px; padding-top: 8px;
    text-align: center; color: #bbb; font-size: 12px; line-height: 1.6; }
  #credit b { color: #f2b632; }
  #credit a { color: #f2b632; text-decoration: none; font-weight: 600; }
  #credit a:hover { text-decoration: underline; }
  .section { border-top: 1px solid rgba(255,255,255,0.12); margin-top: 10px; padding-top: 8px; }
  #sceneBox { display: block; }
</style>
</head>

<script>
// ================= WebGL setup =================
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: false });
if (!gl) { alert('WebGL is not available in this browser.'); }

const MAX = 40;

const vertSrc = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const fragSrc = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec4 uBlobs[40];
uniform int uCount;
uniform float uBass, uMid, uHigh, uPulse;
uniform vec2 uPlate;
uniform vec3 uPal[5];
uniform float uDish, uHue, uRot, uZoom, uFroth;
uniform float uBright, uSat;
uniform sampler2D uScene;
uniform float uHasScene, uProj, uAmbient, uProjSize;
uniform vec2 uSceneScale;
uniform vec2 uProjCenter;
uniform vec4 uMask;      // screen area on the picture: left, bottom, right, top
uniform float uMaskOn;
uniform sampler2D uMatte;
uniform sampler2D uLogo;
uniform vec4 uLogoRect;   // center x, center y, width, height on the picture
uniform float uLogoOn;  // white = band and gear in front of the screen

// smooth, gridless noise: precise hash (no sin) + gradient noise with
// soft (quintic) blending, so no square cells show in the liquid
vec2 hash2(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}
float grad(vec2 i, vec2 f){
  float a = hash2(i).x * 6.2831853;
  return dot(vec2(cos(a), sin(a)), f);
}
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*f*(f*(f*6.0 - 15.0) + 10.0);
  float n = mix(mix(grad(i, f),                 grad(i + vec2(1.0,0.0), f - vec2(1.0,0.0)), u.x),
                mix(grad(i + vec2(0.0,1.0), f - vec2(0.0,1.0)), grad(i + vec2(1.0,1.0), f - vec2(1.0,1.0)), u.x), u.y);
  return clamp(0.5 + 0.75*n, 0.0, 1.0);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 4; i++){ v += a*noise(p); p = m*p + vec2(17.3, 9.1); a *= 0.5; }
  return v;
}

// smooth loop through the 5 palette colors
vec3 pal(float x){
  x = fract(x) * 5.0;
  vec3 c = vec3(0.0);
  for (int i = 0; i < 5; i++){
    float d = mod(x - float(i) + 2.5, 5.0) - 2.5;
    float w = max(0.0, 1.0 - abs(d));
    w = w*w*(3.0 - 2.0*w);
    c += uPal[i] * w;
  }
  return c;
}

float froth(vec2 p, float t){
  vec2 i = floor(p), f = fract(p);
  float d1 = 8.0, d2 = 8.0;
  for (int y = -1; y <= 1; y++){
    for (int x = -1; x <= 1; x++){
      vec2 g = vec2(float(x), float(y));
      vec2 o = hash2(i + g);
      o = 0.5 + 0.45*sin(t*0.4 + 6.2831*o);
      float d = length(g + o - f);
      if (d < d1){ d2 = d1; d1 = d; }
      else if (d < d2){ d2 = d; }
    }
  }
  return d2 - d1;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / min(uRes.x, uRes.y);
  float sceneOn = step(0.5, uHasScene);
  vec2 puv = (uv - uProjCenter*sceneOn) / mix(1.0, uProjSize, sceneOn);   // projection spot and size on the scene
  float dist = length(puv);
  vec2 p = puv * uZoom;
  float cs = cos(uRot), sn = sin(uRot);
  p = mat2(cs, -sn, sn, cs) * p;
  p += uPlate;
  float t = uTime;

  // ---- swirling dye ----
  vec2 q = vec2(fbm(p*1.3 + vec2(0.0, t*0.05)),
                fbm(p*1.3 + vec2(5.2, -t*0.045)));
  vec2 r = vec2(fbm(p*1.3 + 3.2*q + vec2(1.7, 9.2) + t*0.035),
                fbm(p*1.3 + 3.2*q + vec2(8.3, 2.8) - t*0.04));
  float warp = 0.45 + 0.5*uBass + 0.6*uPulse;
  vec2 wp = p + warp*(r - 0.5);
  float f = fbm(wp*1.7 + r*2.3);

  vec3 col = pal(f*1.3 + q.x*0.6 + uHue);
  col *= 0.35 + 0.65*smoothstep(0.15, 0.85, f);
  float layers = 0.5 + 0.5*sin(f*14.0 + t*0.4);
  col = mix(col, col*0.4, smoothstep(0.6, 0.98, layers)*0.3);
  col += 0.08*uMid * pal(f + 0.5 + uHue);

  // ---- froth ----
  if (uFroth > 0.5){
    float fr = froth(wp*6.0 + q*2.5, t);
    float edge = 1.0 - smoothstep(0.0, 0.07 + 0.04*uBass, fr);
    col = mix(col, col*0.4, edge*0.4);
    col += edge * 0.12 * pal(f + 0.3 + uHue);
  }

  // ---- color blobs (see-through dye drops) ----
  vec2 wpb = p + (warp*0.5)*(q - 0.5);
  for (int i = 0; i < 40; i++){
    if (i >= uCount) break;
    vec4 b = uBlobs[i];
    vec2 d = wpb - b.xy;
    float len = length(d);
    if (len > b.z * 1.5) continue;
    float ang = atan(d.y, d.x);
    float wob = 1.0 + (0.08*sin(3.0*ang + t*0.9 + b.w*20.0)
                     + 0.05*sin(5.0*ang - t*1.1 + b.w*13.0)) * (1.0 + 0.8*uBass);
    float R = b.z * wob;
    float k = len / R;
    float inside = 1.0 - smoothstep(0.82, 1.0, k);
    vec3 bc = pal(b.w + uHue);
    vec3 lens = bc * (0.6 + 0.35*(1.0 - k*k));
    vec3 tinted = col * bc * 1.4;
    col = mix(col, mix(tinted, lens, 0.55), inside*0.8);
    float rim = smoothstep(0.78, 0.93, k) * (1.0 - smoothstep(0.95, 1.05, k));
    col += rim * (0.08 + 0.25*uHigh) * mix(bc, vec3(1.0), 0.3);
  }

  // ---- projector feel ----
  col *= uBright * (0.8 + 0.35*uBass + 0.95*uPulse);
  float l = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(l), col, uSat);
  col = clamp(col, 0.0, 1.0);
  float vig = smoothstep(1.5, 0.3, dist);
  col *= mix(1.0, vig, 0.55);
  float dishMask = smoothstep(0.95, 0.85, dist);
  col *= mix(1.0, dishMask, uDish);

  // ---- throw it onto the club scene ----
  if (uHasScene > 0.5){
    vec2 suv = gl_FragCoord.xy / uRes;
    suv = 0.5 + (suv - 0.5) * uSceneScale;
    vec3 sc = texture2D(uScene, suv).rgb;
    float m = 1.0;
    if (uMaskOn > 0.5){
      // light lands only on the back-of-stage screen, with soft edges
      float e = 0.012;
      vec2 a = smoothstep(uMask.xy - e, uMask.xy + e, suv);
      vec2 b = 1.0 - smoothstep(uMask.zw - e, uMask.zw + e, suv);
      m = a.x * a.y * b.x * b.y;
      // a faint glow spills just past the edges, like a real projector
      vec2 c = 0.5*(uMask.xy + uMask.zw), h = 0.5*(uMask.zw - uMask.xy);
      vec2 o = max(abs(suv - c) - h, 0.0);
      float spill = exp(-length(o) * 18.0) * 0.12;
      m = max(m, spill);
      // keep the light off the band, drums and amps so it falls behind them
      m *= 1.0 - 0.94 * texture2D(uMatte, suv).r;
    }
    // room keeps its own look; the screen gets the projector light
    col = sc * mix(vec3(uAmbient), vec3(uAmbient*0.2) + col * uProj * 2.2, m);
    // DazeMagic sign mounted on the beam above the screen
    if (uLogoOn > 0.5){
      vec2 lu = (suv - uLogoRect.xy) / uLogoRect.zw + 0.5;
      if (lu.x > 0.0 && lu.x < 1.0 && lu.y > 0.0 && lu.y < 1.0){
        vec4 lg = texture2D(uLogo, lu);
        col = mix(col, lg.rgb * clamp(uAmbient, 0.45, 1.2), lg.a);
      }
    }
  }

  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const msg = gl.getShaderInfoLog(s);
    alert('Shader error:\n' + msg);
    throw new Error(msg);
  }
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vertSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) alert('Link error:\n' + gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
['uRes','uTime','uBlobs','uCount','uBass','uMid','uHigh','uPulse','uPlate','uPal','uDish','uHue','uRot','uZoom','uFroth',
 'uBright','uSat','uScene','uHasScene','uProj','uAmbient','uProjSize','uSceneScale','uProjCenter','uMask','uMaskOn','uMatte','uLogo','uLogoRect','uLogoOn']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

// ================= Controls =================
const el = id => document.getElementById(id);
const ui = {};
['sens','punch','speed','count','size','drift','dish','froth','palette','bright','sat','quality','proj','ambient','projSize','projY']
  .forEach(id => ui[id] = el(id));

function resize(){
  const q = parseFloat(ui.quality.value);
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5) * q;
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
ui.quality.onchange = resize;
resize();

// ================= Club scene picture =================
const sceneTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, sceneTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.uniform1i(U.uScene, 0);

// ================= Audio =================
let actx = null, analyser = null, freqData = null, prevData = null;
let currentSource = null, fileSource = null, streamRef = null;
let mode = 'demo';
const player = el('player');

function ensureAudio(){
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.25;   // quick response so beats are caught
    analyser.minDecibels = -85;
    analyser.maxDecibels = -20;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    prevData = new Uint8Array(analyser.frequencyBinCount);
  }
  if (actx.state === 'suspended') actx.resume();
}
function stopCurrent(){
  if (currentSource && currentSource !== fileSource) { try { currentSource.disconnect(); } catch(e){} }
  if (streamRef) { streamRef.getTracks().forEach(t => t.stop()); streamRef = null; }
  if (mode === 'file') player.pause();
  currentSource = null;
}
function setMode(m, text){
  mode = m;
  ['btnFile','btnMic','btnPC','btnDemo'].forEach(b => el(b).classList.remove('on'));
  el({file:'btnFile', mic:'btnMic', pc:'btnPC', demo:'btnDemo'}[m]).classList.add('on');
  el('status').textContent = text;
  player.style.display = (m === 'file') ? 'block' : 'none';
  resetLevels();
}

el('btnFile').onclick = () => el('fileInput').click();
el('fileInput').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  ensureAudio();
  stopCurrent();
  player.src = URL.createObjectURL(f);
  if (!fileSource) {
    fileSource = actx.createMediaElementSource(player);
    fileSource.connect(analyser);
    analyser.connect(actx.destination);
  }
  currentSource = fileSource;
  player.play();
  setMode('file', 'Playing: ' + f.name);
};

async function useStream(stream, m, text){
  ensureAudio();
  stopCurrent();
  streamRef = stream;
  const audioTracks = stream.getAudioTracks();
  if (!audioTracks.length) {
    stream.getTracks().forEach(t => t.stop());
    streamRef = null;
    alert('No sound came through. For PC Audio, choose "Entire screen" and tick "Share system audio".');
    setMode('demo', 'Demo mode (no sound)');
    return;
  }
  const src = actx.createMediaStreamSource(new MediaStream(audioTracks));
  src.connect(analyser); // not sent to speakers, so no feedback
  currentSource = src;
  setMode(m, text);
}

el('btnMic').onclick = async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });

el('btnPC').onclick = async () => {

};

function binOf(hz){ return Math.round(hz / (actx.sampleRate / 2) * freqData.length); }
function bandLevel(lo, hi){
  const a = Math.max(1, binOf(lo)), b = Math.min(freqData.length - 1, binOf(hi));
  let sum = 0;
  for (let i = a; i <= b; i++) sum += freqData[i];
  return sum / ((b - a + 1) * 255);
}

// Each level is stretched between its own recent quiet and loud points,
// so loud mastered songs still swing fully.
function makeNorm(){ return { lo: 1, hi: 0 }; }
const norms = { bass: makeNorm(), mid: makeNorm(), high: makeNorm(), all: makeNorm() };
let fluxAvg = 1;
function resetLevels(){
  for (const k in norms) { norms[k].lo = 1; norms[k].hi = 0; }
  fluxAvg = 1;
  kickPrev = 0; kickAvg = 0.3;
}
function normalize(n, v, dt){
  if (v > n.hi) n.hi = v; else n.hi += (v - n.hi) * Math.min(1, dt * 0.25);
  if (v < n.lo) n.lo = v; else n.lo += (v - n.lo) * Math.min(1, dt * 0.25);
  const range = Math.max(0.06, n.hi - n.lo);
  return Math.min(1, Math.max(0, (v - n.lo) / range));
}

// ================= Mouse: move the plate =================
let dragging = false, lastMX = 0, lastMY = 0;
const plate = { x: 0, y: 0, tx: 0, ty: 0 };
function toUV(cx, cy){
  const m = Math.min(window.innerWidth, window.innerHeight);
  return [(cx - window.innerWidth/2)/m, -(cy - window.innerHeight/2)/m];
}
canvas.addEventListener('pointerdown', e => { dragging = true; [lastMX, lastMY] = toUV(e.clientX, e.clientY); });
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointermove', e => {
  wake();
  if (!dragging) return;
  const [mx, my] = toUV(e.clientX, e.clientY);
  const dx = mx - lastMX, dy = my - lastMY;
  plate.tx -= dx * 0.6; plate.ty -= dy * 0.6;
  for (const b of blobs) {
    const d = Math.hypot(b.x - mx - plate.x, b.y - my - plate.y);
    const w = Math.exp(-d * 2.5);
    b.kx += dx * 6 * w; b.ky += dy * 6 * w;
  }
  lastMX = mx; lastMY = my;
});

function analyze(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastAnalyze) / 1000);
  lastAnalyze = now;
  if (mode === 'demo' || !analyser) return;
  const sens = parseFloat(ui.sens.value);
  analyser.getByteFrequencyData(freqData);
    lv.bass = normalize(norms.bass, bandLevel(25, 160), dt);
    lv.mid  = normalize(norms.mid,  bandLevel(300, 2500), dt);
    lv.high = normalize(norms.high, bandLevel(4000, 12000), dt);
    lv.all  = normalize(norms.all,  bandLevel(25, 8000), dt);

    // kick drum finder
    const kickNow = bandLevel(35, 120);
    const kickRise = kickNow - kickPrev;
    kickPrev = kickNow;
    const kickHit = kickNow > kickAvg * (1.08 + 0.25 / sens) + 0.02 && kickRise > 0.015;
    kickAvg += (kickNow - kickAvg) * Math.min(1, dt * 1.5);

    // snare / chords / any sudden change across the whole song (bass counts double)
    const bassTop = binOf(200), top = binOf(8000);
    let flux = 0;
    for (let i = 1; i <= top; i++) {
      const d = freqData[i] - prevData[i];
      if (d > 0) flux += (i <= bassTop) ? d * 2 : d;
    }
    flux /= top;
    prevData.set(freqData);
    const fluxHit = flux > fluxAvg * (1.1 + 0.45 / sens) + 0.25;
    fluxAvg += (flux - fluxAvg) * Math.min(1, dt * 2.5);

    // fast songs can fire up to ~10 times a second
    const gap = Math.max(95, beatInterval * 0.4);
    if ((kickHit || fluxHit) && now - lastBeat > gap) {
      const strength = Math.max(flux / (fluxAvg + 0.01) - 1, kickNow / (kickAvg + 0.01) - 0.9, 0);
      pendingBeat = Math.max(pendingBeat, Math.min(1.4, Math.max(0.7, strength)));
      // learn the song's tempo from the time between beats
      const iv = now - lastBeat;
      if (iv > 220 && iv < 1100) {
        intervals.push(iv); if (intervals.length > 16) intervals.shift();
        const sorted = intervals.slice().sort((a, b) => a - b);
        const med = sorted[Math.floor(sorted.length / 2)];
        beatInterval += (med - beatInterval) * 0.3;
      }
      lastBeat = now;
    }
}
setInterval(analyze, 10);


function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const sens = parseFloat(ui.sens.value);
  const punch = parseFloat(ui.punch.value);
  const speed = parseFloat(ui.speed.value);
  const count = parseInt(ui.count.value);
  const size = parseFloat(ui.size.value);
  const drift = parseFloat(ui.drift.value);

  // ---- read the music (measured separately, 100 times a second) ----
  let bass, mid, high, all, beat = 0;
  if (mode !== 'demo' && analyser) {
    bass = lv.bass; mid = lv.mid; high = lv.high; all = lv.all;
    beat = pendingBeat; pendingBeat = 0;
  } else {
    const s = now / 1000;
    bass = 0.5 + 0.25*Math.sin(s*1.6) + 0.15*Math.sin(s*0.6);
    mid = 0.5 + 0.25*Math.sin(s*0.7);
    high = 0.3 + 0.15*Math.sin(s*2.3);
    all = 0.5;
    if (now - demoBeat > 500) { demoBeat = now; beat = 0.8; beatInterval = 500; }
  }
  const gain = 0.6 + sens * 0.4;
  bass = Math.min(1, bass * gain); mid = Math.min(1, mid * gain);
  high = Math.min(1, high * gain); all = Math.min(1, all * gain);

  // gentle smoothing so nothing snaps
  bassS += (bass - bassS) * ease(bass > bassS ? 12 : 5, dt);
  midS  += (mid  - midS)  * ease(4, dt);
  highS += (high - highS) * ease(6, dt);
  allS  += (all  - allS)  * ease(all > allS ? 10 : 3, dt);
  const showS = 0.45 * bassS + 0.35 * midS + 0.2 * highS;   // whole-song level
  const tempo = Math.min(1.8, Math.max(0.6, 500 / beatInterval)); // 1 = 120 beats a minute
  el('meterFill').style.width = (allS * 100).toFixed(0) + '%';

  // ---- a beat gives the plate a soft push ----
  if (beat > 0) {
    pulseTarget = Math.min(1.8, Math.max(pulseTarget, beat * punch));
    beatDot.style.background = '#d94f8a';
  } else if ((mode === 'demo' ? now - demoBeat : now - lastBeat) > 100) {
    beatDot.style.background = '#333';
  }
  // pulse rises and falls smoothly instead of jumping
  // quick swell on the beat (about 1/30 sec), then a smooth fade
  // swell fast on the beat, then fade in time with the song's tempo,
  // so fast songs give quick separate pulses and slow songs long, rolling ones
  const fade = 3.2 / (beatInterval / 1000);
  if (pulseTarget > pulse) pulse += (pulseTarget - pulse) * ease(40, dt);
  else pulse += (pulseTarget - pulse) * ease(fade * 0.9, dt);
  pulseTarget *= Math.exp(-dt * fade);


  // ---- move everything ----
  // flow follows the song: faster tempo and louder parts stir the liquid faster
  flowTime += dt * speed * (0.45 + 0.35 * tempo + midS * 0.4 + allS * 0.5 + pulse * 0.6);
  for (let i = 0; i < MAX; i++) {
    const b = blobs[i];
    const t = flowTime * b.sp + b.ph;
    // kicks are fed into the speed a little at a time (no sudden jumps)
    const kf = ease(8, dt);
    b.vx += b.kx * kf; b.vy += b.ky * kf;
    b.kx -= b.kx * kf; b.ky -= b.ky * kf;
    b.vx += (Math.sin(t * 0.7) * 0.08 + Math.cos(t * 0.31) * 0.05) * dt * speed;
    b.vy += (Math.cos(t * 0.55) * 0.08 + Math.sin(t * 0.23) * 0.05) * dt * speed;
    const d = Math.hypot(b.x, b.y);
    const pull = 0.2 + Math.max(0, d - 0.6) * 3.0;
    b.vx += -b.x * pull * dt; b.vy += -b.y * pull * dt;
    b.vx *= Math.exp(-dt * 1.0); b.vy *= Math.exp(-dt * 1.0);
    b.x += b.vx * dt * speed; b.y += b.vy * dt * speed;
    b.c += dt * 0.012 * drift;
    const rad = b.r * size * (1 + 0.45 * showS + 0.6 * pulse + 0.08 * Math.sin(t * 1.1));
    blobArr[i*4] = b.x; blobArr[i*4+1] = b.y; blobArr[i*4+2] = rad; blobArr[i*4+3] = b.c;
  }

  // plate glides toward where it was pushed, then drifts home
  plate.x += (plate.tx - plate.x) * ease(3, dt);
  plate.y += (plate.ty - plate.y) * ease(3, dt);
  plate.tx *= Math.exp(-dt * 0.6); plate.ty *= Math.exp(-dt * 0.6);

  // steady turn of the dish that speeds up gently with the music


  hue += dt * 0.02 * drift;

  // colors fade into a new set instead of switching instantly
  const target = PALETTES[parseInt(ui.palette.value)];
  const pf = ease(2, dt);
  for (let i = 0; i < 5; i++) for (let j = 0; j < 3; j++) {
    curPal[i][j] += (target[i][j] - curPal[i][j]) * pf;
    palArr[i*3+j] = curPal[i][j];
  }

  // scene picture: fill the screen without stretching
  const screenAspect = canvas.width / canvas.height;
  let sx = 1, sy = 1;
  if (screenAspect > sceneAspect) sy = sceneAspect / screenAspect;
  else sx = screenAspect / sceneAspect;

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, flowTime);
  gl.uniform4fv(U.uBlobs, blobArr);
  gl.uniform1i(U.uCount, count);
  gl.uniform1f(U.uBass, showS);
  gl.uniform1f(U.uMid, midS);
  gl.uniform1f(U.uHigh, highS);
  gl.uniform1f(U.uPulse, pulse);
  gl.uniform2f(U.uPlate, plate.x, plate.y);
  gl.uniform3fv(U.uPal, palArr);
  gl.uniform1f(U.uDish, ui.dish.checked ? 1 : 0);
  gl.uniform1f(U.uFroth, ui.froth.checked ? 1 : 0);
  gl.uniform1f(U.uHue, hue + 0.06 * pulse * parseFloat(ui.drift.value));
  gl.uniform1f(U.uRot, 0);   // no spinning
  gl.uniform1f(U.uZoom, 1.0 - 0.09 * Math.min(1.3, pulse));
  gl.uniform1f(U.uBright, parseFloat(ui.bright.value));
  gl.uniform1f(U.uSat, parseFloat(ui.sat.value));
  gl.uniform1f(U.uHasScene, hasScene ? 1 : 0);
  gl.uniform1f(U.uProj, parseFloat(ui.proj.value));
  gl.uniform1f(U.uAmbient, parseFloat(ui.ambient.value));
  gl.uniform1f(U.uProjSize, parseFloat(ui.projSize.value));
  gl.uniform2f(U.uSceneScale, sx, sy);
  gl.uniform4f(U.uMask, BALLROOM_SCREEN[0], BALLROOM_SCREEN[1], BALLROOM_SCREEN[2], BALLROOM_SCREEN[3]);
  gl.uniform1f(U.uMaskOn, maskOn ? 1 : 0);
  gl.uniform1f(U.uLogoOn, 0);   // beam logo turned off
  gl.uniform4f(U.uLogoRect, BEAM_LOGO[0], BEAM_LOGO[1], BEAM_LOGO[2], BEAM_LOGO[3]);
  // where the projection lands: middle of the picture, at the chosen height
  const projY01 = 0.5 + (parseFloat(ui.projY.value) - 0.5) / sy;
  gl.uniform2f(U.uProjCenter, 0, (projY01 - 0.5) * canvas.height / Math.min(canvas.width, canvas.height));
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
