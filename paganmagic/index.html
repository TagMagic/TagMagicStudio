body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 45%, rgba(10,5,25,.15) 0%, rgba(10,5,25,.55) 70%, rgba(10,5,25,.8) 100%)}

header{position:relative;z-index:1;padding:14px 16px 0}
.brand{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,18px)}
.brand .wizard{height:clamp(80px,13vw,150px);width:auto;filter:drop-shadow(0 0 18px rgba(255,120,40,.55))}
.brand .logo{height:clamp(56px,9.5vw,118px);width:auto;max-width:72vw;filter:drop-shadow(0 0 22px rgba(255,190,40,.55))}
.tag{text-align:center;color:var(--gold2);font-family:Cinzel,serif;letter-spacing:.25em;font-size:12px;margin-top:2px;
  text-shadow:0 0 10px #000}

.layout{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,660px) 340px;gap:24px;
  justify-content:center;padding:10px 16px 30px;align-items:start}
@media(max-width:1040px){.layout{grid-template-columns:minmax(0,660px)}}
.board-wrap{position:relative;width:100%;aspect-ratio:1}
#board{width:100%;height:100%;display:block;overflow:visible}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48%;text-align:center;pointer-events:none}
#moonIcon{font-size:clamp(44px,9vw,80px);line-height:1.1;filter:drop-shadow(0 0 24px rgba(255,255,200,.75))}
#moonName{font-family:Cinzel,serif;color:var(--gold2);font-size:clamp(14px,2.4vw,21px);margin-top:4px;text-shadow:0 0 12px rgba(255,200,60,.6)}
#moonFx{color:#fff;font-size:clamp(11px,1.8vw,14px);margin-top:4px}
#roundInfo{color:var(--muted);font-size:clamp(10px,1.6vw,13px);margin-top:8px;letter-spacing:.05em}
#goalInfo{color:var(--gold);font-size:clamp(10px,1.6vw,13px);margin-top:3px;font-weight:700}

.panel{display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;backdrop-filter:blur(4px);
  box-shadow:0 8px 30px rgba(0,0,0,.45)}
.turnbox{text-align:center}
#turnText{font-family:Cinzel,serif;color:var(--gold2);min-height:44px;display:flex;align-items:center;justify-content:center}
.dice{display:flex;justify-content:center;gap:10px;margin:6px 0 10px}
.die{font-size:72px;line-height:1;color:#fff4c9;filter:drop-shadow(0 0 12px rgba(255,190,40,.7))}
.rolling{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}100%{transform:rotate(-12deg)}}

.btn{font:inherit;cursor:pointer;border-radius:10px;padding:10px 16px;border:1px solid var(--line);
  background:rgba(255,255,255,.08);color:var(--ink);transition:transform .1s, background .2s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.16);transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.gold{background:linear-gradient(180deg,#ffe066,#e09a12);color:#2a1500;border-color:#fff0a8;font-weight:700;
  box-shadow:0 0 16px rgba(255,190,40,.45)}
.btn.primary{background:linear-gradient(180deg,#b07cff,#6a2fe0);border-color:#d2b8ff;font-weight:600;box-shadow:0 0 14px rgba(160,100,255,.5)}
.btn.ghost{background:rgba(16,9,34,.7)}
#rollBtn{width:100%;font-size:18px;padding:13px}

.pcard{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;margin-bottom:8px;transition:all .3s}
.pcard:last-child{margin-bottom:0}
.pcard.active{border-color:var(--c);box-shadow:0 0 18px -3px var(--c);background:rgba(255,255,255,.06)}
.ptop{display:flex;align-items:center;gap:8px}
.dot{width:13px;height:13px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.pname{flex:1;font-weight:600}
.ppow{font-family:Cinzel,serif;color:var(--gold2);font-weight:700}
.bar{height:7px;background:rgba(255,255,255,.1);border-radius:4px;margin:7px 0;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,var(--c),#fff);border-radius:4px;transition:width .6s}
.res{font-size:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fams{margin-left:auto;font-size:18px;letter-spacing:2px}
.fams span{cursor:help}

#log{max-height:230px;overflow:auto;font-size:13px;color:#e6dcff}
.logline{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08);animation:fadein .4s}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.boxhead{font-family:Cinzel,serif;color:var(--gold);font-size:13px;letter-spacing:.12em;margin-bottom:6px}
.row{display:flex;gap:8px}
.row .btn{flex:1}

/* board */
.spin{animation:spin 90s linear infinite;transform-origin:300px 300px}
.spin.rev{animation-direction:reverse;animation-duration:120s}
@keyframes spin{to{transform:rotate(360deg)}}
.sp .base{transition:stroke .3s, stroke-width .3s}
.sp.pulse .base{stroke:#fff !important;stroke-width:6}
.sp{cursor:help}
.sp.target{cursor:pointer}
.sp.target .base{stroke:#fff !important;animation:tgt .7s infinite alternate}
@keyframes tgt{from{stroke-width:3}to{stroke-width:9;stroke:#fff36b}}
.sp.target text{animation:bob .7s infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.token{transition:transform .38s ease}
.token circle{stroke:#fff;stroke-width:2.5}
.token text{font-size:12px;font-weight:800;fill:#1a1030;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.token.on circle{stroke-width:3.5;filter:url(#glow)}
.token.mine.on circle{animation:mine 0.8s infinite alternate}
@keyframes mine{from{r:12}to{r:14.5}}
.floaty{font-size:22px;font-weight:800;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#140d2e;stroke-width:5px;
  animation:floatUp 2.6s ease forwards;transform-box:fill-box}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}12%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translateY(-38px)}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,3,15,.6);backdrop-filter:blur(3px);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:16px}
#rulesModal{z-index:60}
.hidden{display:none !important}
.modal-card{background:linear-gradient(180deg,#34206a,#170d38);border:1.5px solid var(--gold);border-radius:18px;padding:22px;
  max-width:480px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 60px rgba(255,170,40,.25);
  max-height:92vh;overflow:auto;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card h2{font-family:Cinzel,serif;color:var(--gold2);margin:4px 0 8px;font-size:25px;text-shadow:0 0 14px rgba(255,190,40,.5)}
.flavor{font-style:italic;color:#e3d8ff;margin:6px 0 12px}
.sub{color:var(--muted);font-size:14px}
.who{display:inline-block;padding:3px 12px;border-radius:20px;font-weight:700;color:#1a1030;margin-bottom:6px}
.result{font-weight:700;min-height:22px;margin:10px 0;font-size:17px}
.result.good{color:var(--good)} .result.bad{color:var(--bad)}
.mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.thinking{color:var(--muted);font-style:italic}
.sab-icon,.fam-big{font-size:68px;line-height:1.1;filter:drop-shadow(0 0 16px rgba(255,200,80,.6))}
.spell-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.btn.spell{display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.btn.spell .sp-l{flex:1;display:flex;flex-direction:column}
.sp-name{font-weight:700}
.sp-cost{font-size:14px;opacity:.9}
.sp-pow{font-family:Cinzel,serif;color:var(--gold2);font-weight:700;white-space:nowrap}
.standings{text-align:left;margin:12px auto;max-width:280px}
.standings div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.setup-logo{width:100%;max-width:330px;filter:drop-shadow(0 0 16px rgba(255,190,40,.5))}
label.namefield{display:block;margin:14px 0 6px;text-align:left}
label.namefield input{display:block;width:100%;margin-top:6px;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:rgba(0,0,0,.35);color:var(--ink);font:inherit}
.opt{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:10px;text-align:left}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;background:transparent;color:var(--ink);border:0;padding:8px 13px;cursor:pointer}
.seg button.on{background:var(--gold);color:#2a1500;font-weight:700}
.rules{text-align:left;font-size:14px;line-height:1.5}
.rules h3{font-family:Cinzel,serif;color:var(--gold);font-size:15px;margin:14px 0 4px}
.rules ul{margin:4px 0;padding-left:20px}

/* cauldron */
.cauldron-svg{display:block;margin:4px auto}
.cauldron-svg .brew{fill:#3dff7a;transition:fill .3s}
.cauldron-svg .bubbles circle{fill:#9dffb8;animation:bub 1.6s infinite ease-in;transform-box:fill-box}
.cauldron-svg .bubbles circle:nth-child(2){animation-delay:.5s}
.cauldron-svg .bubbles circle:nth-child(3){animation-delay:1s}
.cauldron-svg.boil{animation:shake .12s 8}
.cauldron-svg.boil .brew,.cauldron-svg.boil .bubbles circle{fill:#ff3b3b}
.cauldron-svg .fire{fill:#ff7a1a;animation:flick .4s infinite alternate;transform-origin:60px 108px}
@keyframes flick{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
@keyframes bub{0%{transform:translateY(8px);opacity:0}30%{opacity:.95}100%{transform:translateY(-22px);opacity:0}}
.elements{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:40px;margin:6px 0}
.chip{font-size:28px;animation:pop .35s ease}
.meters{display:flex;justify-content:center;gap:22px;font-size:16px}
.meters b{font-family:Cinzel,serif;color:var(--gold2);font-size:21px}
</style>
</head>

const EVENTS = [

  { good: false, text: "A trickster's curse saps your magic.", fx: p => { p.power = Math.max(0, p.power - 3); return "−3 ✦"; } }
];

const COLORS = ["#ffd23f", "#c084fc", "#2ee6d6", "#ff5c8a"];
const RIVALS = ["Morgana", "Rowan", "Elspeth"];

let S = { players: [], cur: 0, moon: 1, round: 1, target: 50, busy: false, over: false };
const cur = () => S.players[S.cur];
const has = (p, f) => p.familiars.includes(f);
const whoTag = p => `<span class="who" style="background:${p.color}">${p.name}</span>`;

/* ---------- board ---------- */
function pt(r, deg) { const a = deg * Math.PI / 180; return { x: 300 + r * Math.cos(a), y: 300 + r * Math.sin(a) }; }
const spacePos = i => pt(245, -90 + i * 15);
function arc(r, a0, a1) {
  const p0 = pt(r, a0), p1 = pt(r, a1);
  return `M${p0.x} ${p0.y} A${r} ${r} 0 ${(a1 - a0) > 180 ? 1 : 0} 1 ${p1.x} ${p1.y}`;
}

/* ---------- pagan symbols for the outer ring (each drawn in a 40x40 box) ---------- */
function starPts(r, order) {
  return order.map(k => { const a = (-90 + k * 72) * Math.PI / 180; return `${(20 + r * Math.cos(a)).toFixed(1)},${(20 + r * Math.sin(a)).toFixed(1)}`; }).join(" ");
}
function lenses(angles, len, ar) {
  return angles.map(d => {
    const a = d * Math.PI / 180, x = (20 + len * Math.cos(a)).toFixed(1), y = (20 + len * Math.sin(a)).toFixed(1);
    return `<path d="M20 20 A${ar} ${ar} 0 0 1 ${x} ${y} A${ar} ${ar} 0 0 1 20 20"/>`;
  }).join("");
}
function spiralD() {
  let d = "";
  for (let a = 0; a <= Math.PI * 6; a += 0.2) {
    const r = 1 + a * 0.8;
    d += (d ? "L" : "M") + (20 + r * Math.cos(a)).toFixed(1) + " " + (20 + r * Math.sin(a)).toFixed(1);
  }
  return d;
}
const PAGAN = {
  pentacle:   `<circle cx="20" cy="20" r="17"/><polygon points="${starPts(15, [0, 2, 4, 1, 3])}"/>`,
  triplemoon: `<circle cx="20" cy="20" r="7" fill="currentColor"/>
               <path fill="currentColor" d="M13 9 A7 11 0 0 0 13 31 A5 11 0 0 1 13 9Z"/>
               <path fill="currentColor" d="M27 9 A7 11 0 0 1 27 31 A5 11 0 0 0 27 9Z"/>`,
  triquetra:  `${lenses([-90, 30, 150], 16, 11)}<circle cx="20" cy="20" r="9"/>`,
  sunwheel:   `<circle cx="20" cy="20" r="15"/><path d="M20 5V35M5 20H35"/><circle cx="20" cy="20" r="4" fill="currentColor"/>`,
  knot:       `${lenses([45, 135, 225, 315], 16, 10)}<circle cx="20" cy="20" r="9"/>`,
  spiral:     `<path d="${spiralD()}"/>`,
  fire:       `<path d="M20 5 L35 32 L5 32 Z"/>`,
  air:        `<path d="M20 5 L35 32 L5 32 Z M10 23 H30"/>`,
  water:      `<path d="M5 8 L35 8 L20 35 Z"/>`,
  earth:      `<path d="M5 8 L35 8 L20 35 Z M10 17 H30"/>`,
  algiz:      `<path d="M20 5 V35 M20 18 L10 6 M20 18 L30 6"/>`,
  fehu:       `<path d="M15 35 V5 M15 14 L28 6 M15 23 L29 13"/>`
};
const RING_ORDER = ["pentacle", "fire", "triplemoon", "algiz", "triquetra", "air", "sunwheel", "spiral",
                    "pentacle", "water", "triplemoon", "fehu", "knot", "earth", "sunwheel", "spiral"];
const RING_COLORS = ["#ffd23f", "#c084fc", "#2ee6d6", "#ff7ab6"];
function symbolRing() {
  let g = `<circle cx="300" cy="300" r="333" fill="none" stroke="#ffc93c" stroke-width="22" opacity=".08"/><circle cx="300" cy="300" r="333" fill="none" stroke="#ffc93c" stroke-width="1" opacity=".35"/><g class="spin" filter="url(#glow)">`;
  RING_ORDER.forEach((name, k) => {
    const p = pt(333, -90 + k * (360 / RING_ORDER.length) + 11.25);
    g += `<g transform="translate(${(p.x - 19).toFixed(1)} ${(p.y - 19).toFixed(1)}) scale(.95)" color="${RING_COLORS[k % 4]}">
      <g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">${PAGAN[name]}</g></g>`;
  });
  return g + `</g>`;
}

function buildBoard() {
  let grads = Object.entries(SPACE).map(([k, s]) =>
    `<radialGradient id="g_${k}" cx="40%" cy="35%" r="70%"><stop offset="0%" stop-color="${s.g[0]}"/><stop offset="100%" stop-color="${s.g[1]}"/></radialGradient>`).join("");
  let h = `<defs>${grads}
    <radialGradient id="gSab" cx="45%" cy="35%" r="70%"><stop offset="0%" stop-color="#fffbe0"/><stop offset="45%" stop-color="#ffd23f"/><stop offset="100%" stop-color="#d97706"/></radialGradient>
    <radialGradient id="gMid" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4b2a9e" stop-opacity=".95"/><stop offset="70%" stop-color="#22114f" stop-opacity=".92"/><stop offset="100%" stop-color="#120a2e" stop-opacity=".9"/></radialGradient>
    <radialGradient id="gDisc" cx="50%" cy="50%" r="50%"><stop offset="70%" stop-color="#0b0620" stop-opacity=".88"/><stop offset="100%" stop-color="#0b0620" stop-opacity=".35"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bigglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <symbol id="cauldronSym" viewBox="0 0 40 40">
      <circle cx="15" cy="9" r="2.6" fill="#9dffb8"/><circle cx="23" cy="5.5" r="2" fill="#9dffb8"/>
      <ellipse cx="20" cy="15" rx="15" ry="4" fill="#3a3a3a"/><ellipse cx="20" cy="15.5" rx="12.5" ry="2.6" fill="#3dff7a"/>
      <path d="M6 17 Q5 35 20 35 Q35 35 34 17 Z" fill="#141414" stroke="#2a2a2a" stroke-width="1.2"/>
    </symbol>
  </defs>`;
  h += `<circle cx="300" cy="300" r="362" fill="url(#gDisc)"/>`;
  SEASONS.forEach((s, k) => {
    h += `<path d="${arc(245, -90 + (k * 6 - .5) * 15, -90 + (k * 6 + 5.5) * 15)}" stroke="${s.color}" stroke-width="80" fill="none" opacity=".42"/>`;
  });
  h += `<circle cx="300" cy="300" r="203" fill="url(#gMid)"/>`;
  SEASONS.forEach((s, k) => {
    const lp = pt(178, -90 + (k * 6 + 2.5) * 15);
    h += `<text x="${lp.x}" y="${lp.y}" text-anchor="middle" dominant-baseline="central" font-family="Cinzel,serif" font-size="14" font-weight="700" fill="${s.color}" letter-spacing="3" filter="url(#glow)">${s.name.toUpperCase()}</text>`;
  });
  h += symbolRing() + `
        <circle cx="300" cy="300" r="285" fill="none" stroke="#ffc93c" stroke-width="2.5" opacity=".85" filter="url(#glow)"/>
        <circle cx="300" cy="300" r="205" fill="none" stroke="#ffc93c" stroke-width="2.5" opacity=".85" filter="url(#glow)"/>
        <g class="spin rev"><circle cx="300" cy="300" r="196" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="1 8" opacity=".9"/></g>
        <circle cx="300" cy="300" r="245" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="4 8"/>`;
  for (let i = 0; i < 24; i++) {
    const p = spacePos(i), t = typeAt(i), col = SEASONS[seasonOf(i)].color;
    if (t === "sabbat") {
      const sb = SABBATS[i];
      h += `<g class="sp" id="sp${i}"><title>${sb.name} (sabbat): receive a gift and cast a spell.</title>
        <circle class="base" cx="${p.x}" cy="${p.y}" r="32" fill="url(#gSab)" stroke="#fff6cf" stroke-width="3" filter="url(#bigglow)"/>
        <text x="${p.x}" y="${p.y + 1}" text-anchor="middle" dominant-baseline="central" font-size="29">${sb.icon}</text></g>`;
      const deg = -90 + i * 15, lp = pt(300, deg);
      let rot = deg + 90; if (rot > 90 && rot < 270) rot -= 180;
      h += `<text x="${lp.x}" y="${lp.y}" transform="rotate(${rot} ${lp.x} ${lp.y})" text-anchor="middle" dominant-baseline="central" font-family="Cinzel,serif" font-size="14" font-weight="700" fill="#ffe9a8" stroke="#1a0d00" stroke-width="3" paint-order="stroke">${sb.name}</text>`;
    } else {
      const sp = SPACE[t];
      h += `<g class="sp" id="sp${i}"><title>${sp.name}: ${sp.desc}</title>
        <circle class="base" cx="${p.x}" cy="${p.y}" r="26" fill="url(#g_${t})" stroke="${col}" stroke-width="3" filter="url(#glow)"/>`;
      h += t === "cauldron"
        ? `<use href="#cauldronSym" x="${p.x - 17}" y="${p.y - 18}" width="34" height="34"/>`
        : `<text x="${p.x}" y="${p.y + 1}" text-anchor="middle" dominant-baseline="central" font-size="25">${sp.icon}</text>`;
      h += `</g>`;
    }
  }
  h += `<g id="tokens"></g><g id="fx"></g>`;
  $("#board").innerHTML = h;
}

function makeTokens() {
  const g = $("#tokens"); g.innerHTML = "";
  S.players.forEach(p => {
    const t = document.createElementNS(NS, "g");
    t.setAttribute("class", "token" + (p.ai ? "" : " mine"));
    t.innerHTML = `<circle r="12" fill="${p.color}"/><text>${p.name.charAt(0).toUpperCase()}</text>`;
    g.appendChild(t);
    p.el = t;
    placeToken(p);
  });
}
function placeToken(p) {
  const pos = spacePos(p.pos);
  const off = [[-12, -12], [12, -12], [-12, 12], [12, 12]][p.id];
  p.el.style.transform = `translate(${pos.x + off[0]}px, ${pos.y + off[1]}px)`;
}
function pulse(i) {
  const el = $("#sp" + i); if (!el) return;
  el.classList.add("pulse"); setTimeout(() => el.classList.remove("pulse"), 1200);
}
function floatText(p, txt) {
  const pos = spacePos(p.pos);
  const t = document.createElementNS(NS, "text");
  t.setAttribute("x", pos.x); t.setAttribute("y", pos.y - 36);
  t.setAttribute("class", "floaty"); t.textContent = txt;
  $("#fx").appendChild(t);
  setTimeout(() => t.remove(), 2700);
}

/* ---------- UI ---------- */
function log(html) {
  const d = document.createElement("div"); d.className = "logline"; d.innerHTML = html;
  const L = $("#log"); L.prepend(d);
  while (L.children.length > 60) L.lastChild.remove();
}
function renderPlayers() {
  $("#players").innerHTML = S.players.map((p, k) => `
    <div class="pcard ${k === S.cur ? "active" : ""}" style="--c:${p.color}">
      <div class="ptop"><span class="dot"></span><span class="pname">${p.name}</span><span class="ppow">${p.power} ✦</span></div>
      <div class="bar"><div style="width:${Math.min(100, p.power / S.target * 100)}%"></div></div>
      <div class="res"><span>🌿 ${p.herb}</span><span>💎 ${p.crystal}</span><span>💧 ${p.water}</span>${p.ward ? '<span title="Crystal Ward: blocks the next bad Trickster event">🛡️</span>' : ""}
        <span class="fams">${p.familiars.map(f => `<span title="${FAMILIARS[f].name}: ${FAMILIARS[f].desc}">${FAMILIARS[f].icon}</span>`).join("")}</span></div>
    </div>`).join("");
  S.players.forEach((p, k) => p.el && p.el.classList.toggle("on", k === S.cur));
}
function renderCenter() {
  const m = MOONS[S.moon], p = cur();
  $("#moonIcon").textContent = m.icon;
  $("#moonName").textContent = m.name;
  $("#moonFx").textContent = m.fx;
  $("#roundInfo").textContent = `Round ${S.round} · ${SEASONS[seasonOf(p.pos)].name}`;
  $("#goalInfo").textContent = `First to ${S.target} ✦ wins`;
}
function renderAll() { renderPlayers(); renderCenter(); }
function setRoll(on, text) {
  $("#rollBtn").disabled = !on;
  if (text !== undefined) $("#turnText").textContent = text;
}

function showModal(html) { $("#modalCard").innerHTML = html; $("#modal").classList.remove("hidden"); }
function hideModal() { $("#modal").classList.add("hidden"); }
function choose(buttons, where = "#modalBtns") {
  return new Promise(res => {
    const box = $(where); box.innerHTML = "";
    buttons.forEach(b => {
      const el = document.createElement("button");
      el.className = "btn " + (b.cls || "");
      if (b.html) el.innerHTML = b.html; else el.textContent = b.label;
      if (b.disabled) el.disabled = true;
      el.onclick = () => res(b.value);
      box.appendChild(el);
    });
  });
}
/* Every pop-up waits for a click, for you and for rivals */
async function message(title, body, btn = "Continue") {
  showModal(`<h2>${title}</h2>${body}<div id="modalBtns" class="mbtns"></div>`);
  await choose([{ label: btn, value: 1, cls: "gold" }]);
  hideModal();
}

/* ---------- dice & movement ---------- */
async function animateDie(el) {
  el.classList.add("rolling");
  let v = 1;
  for (let k = 0; k < 14; k++) { v = 1 + rnd(6); el.textContent = DIE[v]; await sleep(70 + k * 6); }
  el.classList.remove("rolling");
  return v;
}
async function moveSteps(p, n) {
  const dir = n > 0 ? 1 : -1;
  for (let s = 0; s < Math.abs(n); s++) {
    p.pos = (p.pos + dir + 24) % 24;
    placeToken(p);
    await sleep(STEP_MS);
    if (dir > 0 && p.pos === 0) {
      p.laps++; p.power += 5;
      floatText(p, "+5 ✦");
      log(`🎡 <b>The Wheel turns!</b> ${p.name} completes a year of the Wheel (+5 ✦).`);
      renderPlayers();
    }
  }
  renderCenter();
}
/* Your piece moves by itself. With the Moon Hare you pick which roll to use. */
async function pickMove(p, opts) {
  showModal(`<div class="fam-big">🐇</div><h2>The Moon Hare</h2><p class="flavor">Your hare offers you a choice of paths.</p><div id="modalBtns" class="spell-list"></div>`);
  const v = await choose(opts.map(v => ({
    html: `<span class="sp-l"><span class="sp-name">Move ${v}</span><span class="sp-cost">to ${spaceName((p.pos + v) % 24)}</span></span><span class="sp-pow">${DIE[v]}</span>`,
    value: v, cls: "spell"
  })));
  hideModal();
  return v;
}
async function humanMove(p, options) {
  let v = options[0];
  if (options.length > 1 && options[1] !== v) v = await pickMove(p, options);
  await sleep(400);
  setRoll(false, v > 0 ? `${p.name} moves ${v}…` : `${p.name} goes back ${-v}…`);
  await moveSteps(p, v);
}
function spaceScore(p, idx) {
  const t = typeAt(idx);
  if (t === "sabbat") return SPELLS.some(s => canAfford(p, s)) ? 7 : 3;
  if (t === "cauldron") return 5;
  if (t === "grove") return Object.keys(FAMILIARS).every(f => has(p, f)) ? 3 : 6;
  if (t === "hex") return S.moon === 3 ? 3 : 1;
  return 3;
}

/* ---------- turns ---------- */
async function startTurn() {
  if (S.over) return;
  const p = cur();
  $("#die2").classList.add("hidden");
  renderAll();
  if (p.ai) {
    setRoll(false, `${p.name}'s turn…`);
    await sleep(AI_THINK_MS);
    takeTurn();
  } else {
    setRoll(true, `Your turn, ${p.name}. Roll the die!`);
  }
}
async function takeTurn() {
  if (S.busy || S.over) return;
  S.busy = true;
  const p = cur();
  setRoll(false, p.ai ? `${p.name} rolls…` : "Rolling…");
  const rolls = [await animateDie($("#die1"))];
  if (has(p, "hare")) {
    $("#die2").classList.remove("hidden");
    rolls.push(await animateDie($("#die2")));
  }
  log(`${p.name} rolls ${rolls.map(v => `<b>${v}</b>`).join(" and ")}.`);
  if (p.ai) {
    let v = rolls[0];
    if (rolls.length > 1 && spaceScore(p, (p.pos + rolls[1]) % 24) > spaceScore(p, (p.pos + v) % 24)) v = rolls[1];
    await sleep(500);
    setRoll(false, `${p.name} moves ${v}…`);
    await moveSteps(p, v);
  } else {
    await humanMove(p, rolls);
  }
  setRoll(false, `${p.name} lands on ${spaceName(p.pos)}`);
  await resolveSpace(p, 0);
  renderAll();
  S.busy = false;
  const winner = S.players.find(q => q.power >= S.target);
  if (winner) return gameOver(winner);
  await sleep(TURN_GAP_MS);
  nextPlayer();
}
function nextPlayer() {
  S.cur = (S.cur + 1) % S.players.length;
  if (S.cur === 0) {
    S.round++;
    S.moon = (S.moon + 1) % 4;
    const m = MOONS[S.moon];
    log(`${m.icon} <b>The moon turns: ${m.name}.</b> ${m.fx}.`);
  }
  startTurn();
}

/* ---------- spaces ---------- */
async function resolveSpace(p, depth) {
  const i = p.pos, t = typeAt(i);
  pulse(i);
  if (t === "sabbat") return sabbat(p, i);
  if (t === "herb" || t === "crystal" || t === "moon") {
    const key = t === "moon" ? "water" : t;
    const n = 1 + (S.moon === 1 ? 1 : 0) + (has(p, "toad") ? 1 : 0);
    p[key] += n;
    floatText(p, `+${n} ${ICON[key]}`);
    log(`${SPACE[t].icon} ${p.name} gathers ${n} ${ICON[key]} at the ${SPACE[t].name}.`);
    renderPlayers();
    await sleep(GATHER_MS);
    return;
  }
  if (t === "cauldron") return brew(p);
  if (t === "hex") return trickster(p, depth);
  if (t === "grove") return grove(p);
}

const canAfford = (p, s) => Object.entries(s.cost).every(([k, n]) => p[k] >= n);
const spellPower = (p, s) => s.power + (has(p, "owl") ? 1 : 0);
const costStr = c => Object.entries(c).map(([k, n]) => ICON[k].repeat(n)).join(" ");
function applySpell(p, s) {
  Object.entries(s.cost).forEach(([k, n]) => p[k] -= n);
  const g = spellPower(p, s);
  p.power += g;
  if (s.ward) p.ward = true;
  floatText(p, `+${g} ✦`);
  log(`✨ ${p.name} casts <b>${s.name}</b> (+${g} ✦${s.ward ? ", gains a Ward 🛡️" : ""}).`);
  renderPlayers();
}

async function sabbat(p, i) {
  const sb = SABBATS[i];
  p[sb.gift]++;
  renderPlayers();
  log(`${sb.icon} ${p.name} celebrates <b>${sb.name}</b> and receives +1 ${ICON[sb.gift]}.`);
  const head = `${whoTag(p)}<div class="sab-icon">${sb.icon}</div><h2>${sb.name}</h2><p class="flavor">${sb.text}</p>
    <p class="result good">Sabbat gift: +1 ${ICON[sb.gift]}</p>`;
  if (p.ai) {
    const best = SPELLS.filter(s => canAfford(p, s)).sort((a, b) => b.power - a.power)[0];
    const line = best ? `${p.name} casts <b>${best.name}</b> (+${spellPower(p, best)} ✦)` : `${p.name} saves ingredients for a stronger spell.`;
    showModal(head + `<p>${line}</p><div id="modalBtns" class="mbtns"></div>`);
    await choose([{ label: "Continue", value: 1, cls: "gold" }]);
    hideModal();
    if (best) applySpell(p, best); else log(`${p.name} saves ingredients.`);
  } else {
    showModal(head + `<p class="sub">Cast one spell at this sabbat (you have 🌿 ${p.herb} · 💎 ${p.crystal} · 💧 ${p.water}):</p><div id="modalBtns" class="spell-list"></div>`);
    const opts = SPELLS.map(s => ({
      html: `<span class="sp-l"><span class="sp-name">${s.name}</span><span class="sp-cost">${costStr(s.cost)}</span></span><span class="sp-pow">+${spellPower(p, s)} ✦${s.ward ? " 🛡️" : ""}</span>`,
      value: s.id, cls: "spell", disabled: !canAfford(p, s)
    }));
    opts.push({ label: "Save my ingredients", value: null, cls: "ghost" });
    const id = await choose(opts);
    hideModal();
    if (id) applySpell(p, SPELLS.find(s => s.id === id));
    else log(`${p.name} saves ingredients.`);
  }
}

function aiKeep(p, value, heat, limit, catUsed) {
  const left = limit - heat + (has(p, "cat") && !catUsed ? 1 : 0);
  if (left >= 2) return value < 16;
  return value < 6 && Math.random() < 0.4;
}
async function brew(p) {
  const limit = S.moon === 0 ? 2 : 3, mult = S.moon === 2 ? 2 : 1;
  let value = 0, heat = 0, n = 0, catUsed = false;
  showModal(`${whoTag(p)}<h2>The Cauldron</h2>
    <p class="sub">${p.ai ? p.name + " brews a potion." : "Roll elements to strengthen your potion."} ${limit} 🔥 and it boils over!${mult > 1 ? "<br><b style='color:#ffe9a8'>🌕 Full Moon: potions worth double!</b>" : ""}</p>
    <svg class="cauldron-svg" id="cSvg" viewBox="0 0 120 112" width="140">
      <g class="bubbles"><circle cx="45" cy="36" r="5"/><circle cx="62" cy="30" r="4"/><circle cx="76" cy="38" r="6"/></g>
      <rect x="30" y="92" width="8" height="12" fill="#151515"/><rect x="82" y="92" width="8" height="12" fill="#151515"/>
      <ellipse cx="60" cy="46" rx="44" ry="10" fill="#555"/>
      <ellipse class="brew" cx="60" cy="47" rx="38" ry="7"/>
      <path d="M17 50 Q13 98 60 98 Q107 98 103 50 Z" fill="#111" stroke="#666" stroke-width="2"/>
      <path class="fire" d="M38 110 q6 -14 12 0 q6 -16 12 0 q6 -14 12 0 q5 -10 9 0 z"/>
    </svg>
    <div class="elements" id="cElems"></div>
    <div class="meters"><div>Potion <b id="cVal">0</b> ✦</div><div>Heat <span id="cHeat"></span></div></div>
    <p id="cMsg" class="result"></p>
    <div id="modalBtns" class="mbtns"></div>`);
  const upd = (msg, cls = "") => {
    $("#cVal").textContent = value * mult;
    let hs = ""; for (let k = 0; k < limit; k++) hs += k < heat ? "🔥" : "⚪";
    $("#cHeat").textContent = hs;
    if (msg !== undefined) { $("#cMsg").textContent = msg; $("#cMsg").className = "result " + cls; }
  };
  upd("");
  while (true) {
    let act;
    if (p.ai) {
      $("#modalBtns").innerHTML = `<span class="thinking">${p.name} ${n ? "considers the brew…" : "stirs the pot…"}</span>`;
      await sleep(AI_BREW_MS);
      act = (n === 0 || aiKeep(p, value, heat, limit, catUsed)) ? "roll" : "bottle";
    } else {
      act = await choose(n === 0
        ? [{ label: "Roll Elements", value: "roll", cls: "primary" }]
        : [{ label: "Roll Again", value: "roll", cls: "primary" }, { label: `Bottle Potion (+${value * mult} ✦)`, value: "bottle", cls: "gold" }]);
    }
    if (act === "bottle") {
      const g = value * mult;
      p.power += g;
      upd(`${p.ai ? p.name : "You"} bottled a potion worth +${g} ✦!`, "good");
      log(`🧪 ${p.name} bottles a potion: <b>+${g} ✦</b>.`);
      floatText(p, `+${g} ✦`);
      break;
    }
    const f = FACES[rnd(6)]; n++;
    let note = "";
    if (f.fire) {
      if (has(p, "cat") && !catUsed) { catUsed = true; note = " The Black Cat swats the flame away!"; }
      else heat++;
    }
    value += f.val;
    const chip = document.createElement("span"); chip.className = "chip"; chip.textContent = f.icon; chip.title = f.name;
    $("#cElems").appendChild(chip);
    if (heat >= limit) {
      value = 0;
      upd("BOIL OVER! The potion is ruined.", "bad");
      $("#cSvg").classList.add("boil");
      log(`💥 ${p.name}'s cauldron boils over!`);
      break;
    }
    upd(`${f.name}! +${f.val * mult}${f.fire && !note ? " and the heat rises" : ""}.${note}`);
  }
  renderPlayers();
  await choose([{ label: "Continue", value: 1, cls: "gold" }]);
  hideModal();
}

async function trickster(p, depth) {
  const ev = EVENTS[rnd(EVENTS.length)];
  let result, blocked = false;
  if (!ev.good && S.moon === 3) { blocked = true; result = "The waning moon banishes the mischief. No harm done!"; }
  else if (!ev.good && p.ward) { blocked = true; p.ward = false; result = "Your Crystal Ward shatters, and you are protected!"; }
  else if (ev.move) result = ev.move > 0 ? `Move ahead ${ev.move} spaces.` : `Go back ${-ev.move} spaces.`;
  else result = ev.fx(p);
  renderPlayers();
  log(`🌀 ${p.name}: ${ev.text} <b>${result}</b>`);
  await message("🌀 Trickster's Crossroads", `${whoTag(p)}<p class="flavor">${ev.text}</p><p class="result ${ev.good || blocked ? "good" : "bad"}">${result}</p>`);
  if (ev.move && !blocked) {
    if (p.ai) await moveSteps(p, ev.move);
    else await humanMove(p, [ev.move]);
    if (ev.move > 0 && depth < 1) await resolveSpace(p, depth + 1);
  }
}

async function grove(p) {
  const avail = Object.keys(FAMILIARS).filter(k => !has(p, k));
  if (!avail.length) {
    p.power += 3; renderPlayers();
    log(`🌳 ${p.name}'s familiars frolic in the grove (+3 ✦).`);
    await message("🌳 Familiar Grove", `${whoTag(p)}<p class="flavor">The familiars frolic among the old oaks.</p><p class="result good">+3 ✦</p>`);
    return;
  }
  const k = avail[rnd(avail.length)], f = FAMILIARS[k];
  p.familiars.push(k);
  renderPlayers();
  log(`🌳 A <b>${f.name}</b> ${f.icon} chooses ${p.name}!`);
  await message("🌳 Familiar Grove",
    `${whoTag(p)}<div class="fam-big">${f.icon}</div><p>A <b>${f.name}</b> chooses ${p.ai ? p.name : "you"}!</p><p class="result good">${f.desc}</p>`,
    p.ai ? "Continue" : "Welcome, friend");
}

/* ---------- game setup ---------- */
function getSavedName() { try { return localStorage.getItem("pm_name") || ""; } catch (e) { return ""; } }
function saveName(n) { try { localStorage.setItem("pm_name", n); } catch (e) {} }

function setup() {
  S.over = true;
  setRoll(false, "Welcome, traveler");
  showModal(`<img class="setup-logo" src="${$(".brand .logo").src}" alt="PaganMagic">
    <p class="flavor">Walk the Wheel of the Year. Gather herbs, crystals and moon water, brew daring potions, and cast spells at the eight sabbats.</p>
    <label class="namefield">Your name<input id="pName" maxlength="14" placeholder="Your witch name" value="${getSavedName()}"></label>
    <div class="opt"><span>Rival witches</span><div class="seg" id="segR"><button data-v="1">1</button><button data-v="2" class="on">2</button><button data-v="3">3</button></div></div>
    <div class="opt"><span>Game length</span><div class="seg" id="segL"><button data-v="30">Short</button><button data-v="50" class="on">Normal</button><button data-v="80">Long</button></div></div>
    <div id="modalBtns" class="mbtns"></div>`);
  ["#segR", "#segL"].forEach(id => {
    $(id).querySelectorAll("button").forEach(b => b.onclick = () => {
      $(id).querySelectorAll("button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
    });
  });
  choose([{ label: "Begin the Journey", value: 1, cls: "gold" }]).then(() => {
    const name = ($("#pName").value || "").replace(/[<>&"']/g, "").trim() || "Seeker";
    saveName(name);
    const rivals = +$("#segR .on").dataset.v, target = +$("#segL .on").dataset.v;
    hideModal();
    newGame(name, rivals, target);
  });
}

function newGame(name, rivals, target) {
  S = { players: [], cur: 0, moon: 1, round: 1, target, busy: false, over: false };
  const mk = (id, nm, ai) => ({ id, name: nm, ai, color: COLORS[id], pos: 0, herb: 0, crystal: 0, water: 0, power: 0, familiars: [], ward: false, laps: 0 });
  S.players.push(mk(0, name, false));
  for (let k = 0; k < rivals; k++) S.players.push(mk(k + 1, RIVALS[k], true));
  $("#log").innerHTML = "";
  makeTokens();
  log(`🌙 The coven gathers at Samhain. The first to reach <b>${target} ✦</b> masters the Wheel. Blessed be!`);
  startTurn();
}

async function gameOver(p) {
  S.over = true;
  setRoll(false, `${p.name} wins!`);
  const st = [...S.players].sort((a, b) => b.power - a.power);
  log(`🏆 <b>${p.name} masters the Wheel of the Year!</b>`);
  showModal(`<div class="sab-icon">🏆</div><h2>${p.ai ? p.name + " Wins" : "You Win!"}</h2>
    <p class="flavor">${p.ai ? p.name + " masters the Wheel of the Year first." : "The Wheel bows to your magic. Blessed be!"}</p>
    <div class="standings">${st.map((q, i) => `<div><span>${i + 1}. ${q.name}</span><b>${q.power} ✦</b></div>`).join("")}</div>
    <div id="modalBtns" class="mbtns"></div>`);
  await choose([{ label: "Play Again", value: 1, cls: "gold" }]);
  hideModal();
  setup();
}

/* ---------- rules ---------- */
function showRules() {
  $("#rulesCard").innerHTML = `<h2>How to Play</h2><div class="rules">
    <p>Travel around the Wheel of the Year. The first witch to reach the goal in magic power (✦) wins.</p>
    <h3>Your Turn</h3><ul><li>Roll the die and your piece moves clockwise.</li><li>Do what the space you land on says.</li><li>Passing Samhain completes a year: <b>+5 ✦</b>.</li></ul>
    <h3>Spaces</h3><ul>
      <li>🌿 💎 💧 <b>Gather</b> herbs, crystals or moon water.</li>
      <li><b>Sabbats</b> (the 8 golden festivals): receive a gift, then cast one spell using your ingredients.</li>
      <li><b>Cauldron</b>: roll elements to build a potion. Stop anytime to bottle it for ✦. Too much 🔥 and it boils over and you get nothing!</li>
      <li>🌀 <b>Trickster's Crossroads</b>: a random event, good or bad.</li>
      <li>🌳 <b>Familiar Grove</b>: a familiar joins you with a special power.</li></ul>
    <h3>Spells</h3><ul>${SPELLS.map(s => `<li><b>${s.name}</b>: ${costStr(s.cost)} → +${s.power} ✦${s.ward ? " and a Ward that blocks the next bad Trickster event" : ""}</li>`).join("")}</ul>
    <h3>The Moon</h3><ul>${MOONS.map(m => `<li>${m.icon} <b>${m.name}</b>: ${m.fx}.</li>`).join("")}</ul>
    <p class="sub">The moon changes phase after every round.</p>
    <h3>Familiars</h3><ul>${Object.values(FAMILIARS).map(f => `<li>${f.icon} <b>${f.name}</b>: ${f.desc}</li>`).join("")}</ul>
    </div><div id="rulesBtns" class="mbtns"></div>`;
  $("#rulesModal").classList.remove("hidden");
  choose([{ label: "Got it", value: 1, cls: "gold" }], "#rulesBtns").then(() => $("#rulesModal").classList.add("hidden"));
}

$("#rollBtn").onclick = () => { const p = cur(); if (p && !p.ai && !S.busy && !S.over) takeTurn(); };
$("#rulesBtn").onclick = showRules;
$("#newBtn").onclick = () => { if (!S.busy) setup(); };

buildBoard();
setup();
</script>
</body>
</html>
